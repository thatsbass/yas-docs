<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Yas | Server Health Check</title>
    <style>
      :root {
        --bg: #fff;
        --side: #f8f9fb;
        --ink: #142b49;
        --muted: #657386;
        --line: #e5e9ef;
        --accent: #ffcc00;
        --soft: #fff8d5;
        --code: #14233a;
        --codeink: #e6eef8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          15px/1.75 system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      body.dark {
        --bg: #101927;
        --side: #152132;
        --ink: #e8eef7;
        --muted: #a5b2c5;
        --line: #29384c;
        --soft: #393418;
        --code: #0a111c;
      }
      button,
      input {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      a {
        color: inherit;
      }
      header {
        height: 76px;
        position: fixed;
        inset: 0 0 auto;
        z-index: 20;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 0 32px;
      }
      .brand {
        display: flex;
        gap: 14px;
        align-items: center;
        text-decoration: none;
        white-space: nowrap;
      }
      .brand img {
        width: 53px;
        height: 48px;
        object-fit: contain;
      }
      .brand strong {
        font-size: 17px;
        letter-spacing: -0.5px;
      }
      .brand small {
        display: block;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.2;
      }
      .search {
        margin-left: auto;
        position: relative;
        width: min(360px, 35vw);
      }
      .search input {
        width: 100%;
        border: 1px solid var(--line);
        background: var(--side);
        color: var(--ink);
        border-radius: 8px;
        padding: 9px 45px 9px 14px;
        outline: none;
      }
      .search input:focus {
        border-color: #b59a00;
      }
      .key {
        position: absolute;
        right: 12px;
        top: 9px;
        color: var(--muted);
        font-size: 12px;
      }
      .iconbtn {
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--ink);
        border-radius: 8px;
        padding: 7px 12px;
      }
      .tag {
        font-size: 11px;
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 3px 10px;
        color: var(--muted);
        white-space: nowrap;
      }
      .sidebar {
        position: fixed;
        top: 76px;
        bottom: 0;
        left: 0;
        width: 280px;
        background: var(--side);
        border-right: 1px solid var(--line);
        overflow: auto;
        padding: 24px 17px 40px;
      }
      .side-label {
        font-size: 10px;
        font-weight: 750;
        letter-spacing: 1.5px;
        color: var(--muted);
        margin: 24px 10px 8px;
        text-transform: uppercase;
      }
      .nav {
        display: block;
        text-decoration: none;
        padding: 7px 10px;
        border-radius: 6px;
        font-size: 13px;
        color: var(--muted);
        line-height: 1.5;
      }
      .nav:hover {
        background: var(--line);
        color: var(--ink);
      }
      .nav.active {
        background: var(--soft);
        color: var(--ink);
        font-weight: 650;
        box-shadow: inset 3px 0 var(--accent);
      }
      .workspace {
        margin: 76px 0 0 280px;
        display: grid;
        grid-template-columns: minmax(0, 800px) 220px;
        justify-content: center;
        gap: 46px;
        padding: 44px 40px 80px;
      }
      .crumb {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 28px;
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 1.6px;
        font-weight: 750;
        color: var(--muted);
        text-transform: uppercase;
      }
      .hero {
        padding: 28px 30px;
        background: var(--soft);
        border: 1px solid var(--line);
        border-radius: 14px;
        margin: 0 0 30px;
        position: relative;
        overflow: hidden;
      }
      .hero:after {
        content: "";
        position: absolute;
        width: 180px;
        height: 180px;
        background: var(--accent);
        border-radius: 48% 52% 65% 35%;
        right: -115px;
        top: -70px;
        transform: rotate(24deg);
        opacity: 0.8;
      }
      .hero h1 {
        margin: 8px 0;
        font-size: 38px;
        line-height: 1.15;
        letter-spacing: -1.7px;
      }
      .hero p {
        max-width: 560px;
        color: var(--muted);
        margin: 12px 0 0;
      }
      .meta {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 20px;
      }
      .meta span {
        font-size: 11px;
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 3px 9px;
        background: var(--bg);
      }
      h1 {
        font-size: 36px;
        line-height: 1.2;
        letter-spacing: -1.2px;
        margin: 8px 0 24px;
      }
      h2 {
        font-size: 22px;
        letter-spacing: -0.45px;
        margin: 36px 0 12px;
      }
      p {
        margin: 12px 0 18px;
      }
      article ul {
        padding-left: 22px;
      }
      article li {
        margin: 5px 0;
      }
      article code:not(pre code) {
        background: var(--side);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 1px 5px;
        font-size: 0.87em;
        overflow-wrap: anywhere;
      }
      .codewrap {
        position: relative;
        background: var(--code);
        border-radius: 9px;
        margin: 20px 0;
        color: var(--codeink);
        overflow: hidden;
      }
      .codebar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid #ffffff20;
        padding: 8px 14px;
        font-size: 11px;
        color: #b3c5db;
      }
      .copy {
        background: transparent;
        color: #e6eef8;
        border: 1px solid #ffffff30;
        border-radius: 5px;
        font-size: 11px;
        padding: 3px 8px;
      }
      pre {
        margin: 0;
        padding: 18px;
        overflow: auto;
        line-height: 1.7;
        font-size: 13px;
        tab-size: 4;
      }
      table {
        border-collapse: separate;
        border-spacing: 0;
        width: 100%;
        font-size: 13px;
        margin: 20px 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }
      th,
      td {
        text-align: left;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      th {
        background: var(--side);
        font-weight: 650;
      }
      tr:last-child td {
        border-bottom: 0;
      }
      .tablewrap {
        overflow-x: auto;
      }
      .toc {
        position: sticky;
        top: 110px;
        align-self: start;
        font-size: 12px;
        color: var(--muted);
        border-left: 1px solid var(--line);
        padding-left: 18px;
      }
      .toc a {
        display: block;
        text-decoration: none;
        margin: 10px 0;
      }
      .toc a:hover {
        color: var(--ink);
      }
      .toc strong {
        color: var(--ink);
      }
      .notice {
        border-left: 3px solid var(--accent);
        background: var(--soft);
        padding: 12px 16px;
        border-radius: 0 7px 7px 0;
        margin: 20px 0;
        font-size: 13px;
      }
      .pager {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        border-top: 1px solid var(--line);
        margin-top: 42px;
        padding-top: 22px;
      }
      .pager a {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px 17px;
        text-decoration: none;
        flex: 1;
        font-size: 13px;
      }
      .pager a:last-child {
        text-align: right;
      }
      .pager small {
        display: block;
        color: var(--muted);
      }
      .results {
        position: absolute;
        top: 49px;
        left: 0;
        right: 0;
        background: var(--bg);
        border: 1px solid var(--line);
        box-shadow: 0 12px 30px #0002;
        border-radius: 9px;
        max-height: 60vh;
        overflow: auto;
      }
      .results a {
        display: block;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        text-decoration: none;
        font-size: 13px;
      }
      .results small {
        display: block;
        color: var(--muted);
      }
      .results a:hover {
        background: var(--side);
      }
      .hidden {
        display: none !important;
      }
      .menu {
        display: none;
      }
      .quickgrid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin: 20px 0;
      }
      .quickgrid a {
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 16px;
        text-decoration: none;
        font-weight: 650;
        font-size: 14px;
      }
      .quickgrid small {
        display: block;
        font-weight: 400;
        color: var(--muted);
      }
      .quickgrid a:hover {
        border-color: #c2a000;
      }
      .checklist label {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 8px;
        border-bottom: 1px solid var(--line);
      }
      .checklist input {
        accent-color: #d7ad00;
      }
      .tools {
        border: 1px solid var(--line);
        padding: 18px;
        border-radius: 10px;
        margin: 20px 0;
      }
      .tools input {
        width: 100%;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--ink);
        padding: 7px;
        border-radius: 5px;
      }
      .toolgrid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .toolgrid label {
        font-size: 12px;
        color: var(--muted);
      }
      .out {
        font-size: 24px;
        font-weight: 700;
        margin-top: 12px;
      }
      .footer {
        margin-top: 35px;
        color: var(--muted);
        font-size: 11px;
      }
      @media (max-width: 1100px) {
        .workspace {
          grid-template-columns: minmax(0, 800px);
        }
        .toc {
          display: none;
        }
      }
      @media (max-width: 760px) {
        header {
          padding: 0 12px;
          gap: 8px;
          height: 66px;
        }
        .brand strong {
          font-size: 13px;
        }
        .brand img {
          width: 39px;
        }
        .brand small,
        .tag,
        .key {
          display: none;
        }
        .search {
          width: auto;
          flex: 1;
        }
        .search input {
          padding: 8px;
          width: 100%;
          min-width: 0;
        }
        .sidebar {
          top: 66px;
          transform: translateX(-100%);
          z-index: 15;
          transition: transform 0.2s;
          box-shadow: 8px 0 30px #0002;
        }
        .sidebar.open {
          transform: translateX(0);
        }
        .workspace {
          margin: 66px 0 0;
          padding: 24px 18px 50px;
        }
        .menu {
          display: block;
        }
        .hero {
          padding: 22px;
        }
        .hero h1 {
          font-size: 30px;
        }
        .quickgrid {
          grid-template-columns: 1fr;
        }
        h1 {
          font-size: 30px;
        }
      }
      @media print {
        header,
        .sidebar,
        .toc,
        .pager,
        .copy,
        .footer {
          display: none;
        }
        .workspace {
          margin: 0;
          padding: 0;
          display: block;
        }
        pre {
          white-space: pre-wrap;
        }
        .codewrap {
          background: #eee;
          color: #111;
        }
      }
    </style>
  </head>

    <script>
      const docs = [
        {
          title: "Introduction",
          body: "<p>Le Health Check serveur est un ensemble de contrôles préventifs visant à garantir la disponibilité, la stabilité et les performances d’un serveur Linux. Ce guide est orienté Red Hat Enterprise Linux (RHEL), Support Applicatif N1/N2, et couvre les serveurs SQL Server, Talend ESB, WSO2, Grafana et Jenkins. Il exclut les tests métier et la supervision F5/SolarWinds.<\/p>\n<h2>Objectifs<\/h2>\n<p>Détecter les saturations, contrôler les services, anticiper les incidents, vérifier les sauvegardes et documenter les interventions. Les seuils sont indicatifs, non des procédures officielles Yas.<\/p>\n",
          text: "Le Health Check serveur est un ensemble de contrôles préventifs visant à garantir la disponibilité, la stabilité et les performances d’un serveur Linux. Ce guide est orienté Red Hat Enterprise Linux (RHEL), Support Applicatif N1/N2, et couvre les serveurs SQL Server, Talend ESB, WSO2, Grafana et Jenkins. Il exclut les tests métier et la supervision F5/SolarWinds.\n## Objectifs\nDétecter les saturations, contrôler les services, anticiper les incidents, vérifier les sauvegardes et documenter les interventions. Les seuils sont indicatifs, non des procédures officielles Yas.\n",
          id: "chapitre-1",
        },
        {
          title: "Architecture et précautions",
          body: "<table>\n<thead>\n<tr>\n  <th>Couche<\/th>\n  <th>Contrôles<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Système<\/td>\n  <td>OS, kernel, uptime, horloge<\/td>\n<\/tr>\n<tr>\n  <td>Ressources<\/td>\n  <td>CPU, RAM, swap<\/td>\n<\/tr>\n<tr>\n  <td>Stockage<\/td>\n  <td>Partitions, inodes, I/O<\/td>\n<\/tr>\n<tr>\n  <td>Réseau<\/td>\n  <td>Interfaces, routage, DNS, ports<\/td>\n<\/tr>\n<tr>\n  <td>Exploitation<\/td>\n  <td>Processus, services, logs, backups<\/td>\n<\/tr>\n<tr>\n  <td>Sécurité<\/td>\n  <td>Accès, SELinux, TLS<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Règles de production<\/h2>\n<ul>\n<li>Commencer en lecture seule et identifier l’environnement.<\/li>\n<li>Ne jamais redémarrer, supprimer ou modifier sans validation.<\/li>\n<li>Vérifier les politiques de rétention, les dépendances et les preuves avant intervention.<\/li>\n<li>Ne jamais supprimer les fichiers actifs d’une base de données.<\/li>\n<li>Comparer les mesures avant et après, documenter et escalader selon l’impact.<\/li>\n<\/ul>\n",
          text: "| Couche | Contrôles |\n|---|---|\n| Système | OS, kernel, uptime, horloge |\n| Ressources | CPU, RAM, swap |\n| Stockage | Partitions, inodes, I/O |\n| Réseau | Interfaces, routage, DNS, ports |\n| Exploitation | Processus, services, logs, backups |\n| Sécurité | Accès, SELinux, TLS |\n## Règles de production\n- Commencer en lecture seule et identifier l’environnement.\n- Ne jamais redémarrer, supprimer ou modifier sans validation.\n- Vérifier les politiques de rétention, les dépendances et les preuves avant intervention.\n- Ne jamais supprimer les fichiers actifs d’une base de données.\n- Comparer les mesures avant et après, documenter et escalader selon l’impact.\n",
          id: "chapitre-2",
        },
        {
          title: "Identification du serveur",
          body: '<pre><code class="language-bash">ssh utilisateur@adresse_ip\nwhoami\nid\nhostname\nhostnamectl\ncat /etc/os-release\ncat /etc/redhat-release\nuname -r\nuname -a\ndate\ntimedatectl\nuptime\nwho -b\nlast -x reboot | head\n<\/code><\/pre>\n<p><code>uptime<\/code> indique le temps de fonctionnement, les sessions et les charges moyennes à 1, 5 et 15 minutes. Un redémarrage inattendu est à investiguer. Une horloge incorrecte affecte les certificats, transactions et corrélations de logs.<\/p>\n',
          text: "```bash\nssh utilisateur@adresse_ip\nwhoami\nid\nhostname\nhostnamectl\ncat /etc/os-release\ncat /etc/redhat-release\nuname -r\nuname -a\ndate\ntimedatectl\nuptime\nwho -b\nlast -x reboot | head\n```\n`uptime` indique le temps de fonctionnement, les sessions et les charges moyennes à 1, 5 et 15 minutes. Un redémarrage inattendu est à investiguer. Une horloge incorrecte affecte les certificats, transactions et corrélations de logs.\n",
          id: "chapitre-3",
        },
        {
          title: "CPU et Load Average",
          body: '<pre><code class="language-bash">lscpu\nnproc\ntop\nps -eo pid,ppid,user,comm,%cpu,%mem --sort=-%cpu | head -n 15\nmpstat -P ALL 1 5\nsar -u 1 5\nsar -u\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n  <th>Champ top<\/th>\n  <th>Signification<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>us<\/td>\n  <td>CPU utilisateur<\/td>\n<\/tr>\n<tr>\n  <td>sy<\/td>\n  <td>CPU noyau<\/td>\n<\/tr>\n<tr>\n  <td>ni<\/td>\n  <td>Priorité ajustée<\/td>\n<\/tr>\n<tr>\n  <td>id<\/td>\n  <td>CPU inactif<\/td>\n<\/tr>\n<tr>\n  <td>wa<\/td>\n  <td>Attente I/O<\/td>\n<\/tr>\n<tr>\n  <td>hi / si<\/td>\n  <td>Interruptions matérielles / logicielles<\/td>\n<\/tr>\n<tr>\n  <td>st<\/td>\n  <td>Temps retenu par hyperviseur<\/td>\n<\/tr>\n<tr>\n  <td>CPU soutenu<\/td>\n  <td>Statut<\/td>\n<\/tr>\n<tr>\n  <td>&lt;70%<\/td>\n  <td>Normal<\/td>\n<\/tr>\n<tr>\n  <td>70–85%<\/td>\n  <td>Warning<\/td>\n<\/tr>\n<tr>\n  <td>85–95%<\/td>\n  <td>Élevé<\/td>\n<\/tr>\n<tr>\n  <td>&gt;95%<\/td>\n  <td>Critique<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Le load average compte les tâches exécutables et en attente non interruptible. Comparer au nombre de CPU logiques, sans assimiler ce rapport à un pourcentage CPU. Un pic isolé ne suffit pas. <code>sysstat<\/code> est nécessaire pour sar/mpstat ; historique si collecte activée.<\/p>\n<h2>Cas Talend : CPU à 95 %<\/h2>\n<pre><code class="language-bash">uptime\nnproc\ntop\nps -eo pid,user,comm,%cpu --sort=-%cpu | head\ntop -H -p 2456\n<\/code><\/pre>\n<p>Identifier le job et ses threads, consulter les logs, escalader. Ne pas tuer Java directement.<\/p>\n',
          text: "```bash\nlscpu\nnproc\ntop\nps -eo pid,ppid,user,comm,%cpu,%mem --sort=-%cpu | head -n 15\nmpstat -P ALL 1 5\nsar -u 1 5\nsar -u\n```\n| Champ top | Signification |\n|---|---|\n| us | CPU utilisateur |\n| sy | CPU noyau |\n| ni | Priorité ajustée |\n| id | CPU inactif |\n| wa | Attente I/O |\n| hi / si | Interruptions matérielles / logicielles |\n| st | Temps retenu par hyperviseur |\n| CPU soutenu | Statut |\n| <70% | Normal |\n| 70–85% | Warning |\n| 85–95% | Élevé |\n| >95% | Critique |\nLe load average compte les tâches exécutables et en attente non interruptible. Comparer au nombre de CPU logiques, sans assimiler ce rapport à un pourcentage CPU. Un pic isolé ne suffit pas. `sysstat` est nécessaire pour sar/mpstat ; historique si collecte activée.\n## Cas Talend : CPU à 95 %\n```bash\nuptime\nnproc\ntop\nps -eo pid,user,comm,%cpu --sort=-%cpu | head\ntop -H -p 2456\n```\nIdentifier le job et ses threads, consulter les logs, escalader. Ne pas tuer Java directement.\n",
          id: "chapitre-4",
        },
        {
          title: "Mémoire RAM",
          body: "<pre><code class=\"language-bash\">free -h\nps aux --sort=-%mem | head -n 15\nps -eo pid,user,comm,rss,%mem --sort=-rss | head -n 15\ncat /proc/meminfo\nsar -r\njournalctl -k --since '24 hours ago' | grep -Ei 'out of memory|oom-kill|killed process'\ndmesg -T | grep -Ei 'oom|out of memory|killed process'\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n  <th>Champ<\/th>\n  <th>Signification<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>total<\/td>\n  <td>Mémoire physique<\/td>\n<\/tr>\n<tr>\n  <td>used<\/td>\n  <td>Mémoire utilisée selon la version de free<\/td>\n<\/tr>\n<tr>\n  <td>free<\/td>\n  <td>Mémoire inutilisée<\/td>\n<\/tr>\n<tr>\n  <td>shared<\/td>\n  <td>Mémoire partagée<\/td>\n<\/tr>\n<tr>\n  <td>buff/cache<\/td>\n  <td>Buffers et caches<\/td>\n<\/tr>\n<tr>\n  <td>available<\/td>\n  <td>Estimation de mémoire disponible sans swap important<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Prioriser <code>available<\/code> plutôt que <code>free<\/code>. RSS est généralement en Kio. Seuils RAM disponible : &gt;30 % normal, 15–30 % surveillance, 5–15 % élevé, &lt;5 % critique, à corréler avec la pression mémoire.<\/p>\n<h2>Cas WSO2<\/h2>\n<p>16 Go de RAM, 250 Mo disponibles, swap 3,8/4 Go : vérifier free, vmstat, processus et événements OOM. Causes possibles : fuite Java, trafic ou JVM mal dimensionnée. Escalader avant modification.<\/p>\n",
          text: "```bash\nfree -h\nps aux --sort=-%mem | head -n 15\nps -eo pid,user,comm,rss,%mem --sort=-rss | head -n 15\ncat /proc/meminfo\nsar -r\njournalctl -k --since '24 hours ago' | grep -Ei 'out of memory|oom-kill|killed process'\ndmesg -T | grep -Ei 'oom|out of memory|killed process'\n```\n| Champ | Signification |\n|---|---|\n| total | Mémoire physique |\n| used | Mémoire utilisée selon la version de free |\n| free | Mémoire inutilisée |\n| shared | Mémoire partagée |\n| buff/cache | Buffers et caches |\n| available | Estimation de mémoire disponible sans swap important |\nPrioriser `available` plutôt que `free`. RSS est généralement en Kio. Seuils RAM disponible : >30 % normal, 15–30 % surveillance, 5–15 % élevé, <5 % critique, à corréler avec la pression mémoire.\n## Cas WSO2\n16 Go de RAM, 250 Mo disponibles, swap 3,8/4 Go : vérifier free, vmstat, processus et événements OOM. Causes possibles : fuite Java, trafic ou JVM mal dimensionnée. Escalader avant modification.\n",
          id: "chapitre-5",
        },
        {

        {
          title: "Stockage et partitions",
          body: "<pre><code class=\"language-bash\">df -h\ndf -hT\nlsblk\nlsblk -f\nfindmnt\nfindmnt -T /var/opt/mssql\ncat /etc/fstab\ndu -xhd1 /var | sort -hr\ndu -xhd1 /var/opt/mssql | sort -hr\nfind /var -xdev -type f -size +1G -exec ls -lh {} \\;\nfind /var -xdev -type f -printf '%s\\t%p\\n' | sort -nr | head -n 20 | numfmt --field=1 --to=iec\nfind /opt -type f -name 'mesure.sh'\nlsof +L1\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n  <th>Utilisation<\/th>\n  <th>Statut<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>&lt;70%<\/td>\n  <td>Normal<\/td>\n<\/tr>\n<tr>\n  <td>70–79%<\/td>\n  <td>Warning<\/td>\n<\/tr>\n<tr>\n  <td>80–89%<\/td>\n  <td>Élevé<\/td>\n<\/tr>\n<tr>\n  <td>90–94%<\/td>\n  <td>Critique<\/td>\n<\/tr>\n<tr>\n  <td>≥95%<\/td>\n  <td>Urgent<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><code>df<\/code> mesure le filesystem, <code>du<\/code> les fichiers accessibles, <code>lsblk<\/code> les périphériques. <code>du -xhd1<\/code> reste sur un filesystem, affiche en unités lisibles et limite la profondeur. Les scans globaux peuvent être coûteux. Un fichier supprimé mais ouvert reste occupé jusqu’à fermeture du descripteur. Vérifier lsof avant tout redémarrage. Les blocs réservés, métadonnées et montages masqués expliquent aussi des écarts df/du.<\/p>\n",
          text: "```bash\ndf -h\ndf -hT\nlsblk\nlsblk -f\nfindmnt\nfindmnt -T /var/opt/mssql\ncat /etc/fstab\ndu -xhd1 /var | sort -hr\ndu -xhd1 /var/opt/mssql | sort -hr\nfind /var -xdev -type f -size +1G -exec ls -lh {} \\;\nfind /var -xdev -type f -printf '%s\\t%p\\n' | sort -nr | head -n 20 | numfmt --field=1 --to=iec\nfind /opt -type f -name 'mesure.sh'\nlsof +L1\n```\n| Utilisation | Statut |\n|---|---|\n| <70% | Normal |\n| 70–79% | Warning |\n| 80–89% | Élevé |\n| 90–94% | Critique |\n| ≥95% | Urgent |\n`df` mesure le filesystem, `du` les fichiers accessibles, `lsblk` les périphériques. `du -xhd1` reste sur un filesystem, affiche en unités lisibles et limite la profondeur. Les scans globaux peuvent être coûteux. Un fichier supprimé mais ouvert reste occupé jusqu’à fermeture du descripteur. Vérifier lsof avant tout redémarrage. Les blocs réservés, métadonnées et montages masqués expliquent aussi des écarts df/du.\n",

        },

        {

          body: "<pre><code class=\"language-bash\">iostat -xz 1 5\npidstat -d 1 5\niotop -o\njournalctl -k --since today | grep -Ei 'I/O error|buffer I/O|filesystem error|XFS|EXT4'\npvs\nvgs\nlvs\nlvs -a -o lv_name,vg_name,lv_size,data_percent,metadata_percent\nsmartctl -H /dev/sda\nsmartctl -a /dev/sda\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n  <th>I/O<\/th>\n  <th>Signification<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>r/s, w/s<\/td>\n  <td>Opérations par seconde<\/td>\n<\/tr>\n<tr>\n  <td>rkB/s, wkB/s<\/td>\n  <td>Débits<\/td>\n<\/tr>\n<tr>\n  <td>await<\/td>\n  <td>Latence moyenne<\/td>\n<\/tr>\n<tr>\n  <td>aqu-sz<\/td>\n  <td>File d’attente moyenne<\/td>\n<\/tr>\n<tr>\n  <td>%util<\/td>\n  <td>Temps de traitement I/O<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Latence et file croissantes peuvent indiquer saturation. %util seul est insuffisant pour SSD modernes. SMART dépend du matériel et peut être inaccessible en VM/SAN. Vérifier les pools LVM thin et leurs métadonnées. Ne pas lancer fsck/xfs_repair sur un filesystem monté en écriture.<\/p>\n",

          body: "<pre><code class=\"language-bash\">ps aux\npgrep -af java\npgrep -af sqlservr\nps -p 2456 -o pid,ppid,user,stat,etime,%cpu,%mem,cmd\npstree -p\nps -eo pid,ppid,stat,comm | awk '$3 ~ /^Z/'\nps -eo pid,ppid,stat,wchan:32,comm | awk '$3 ~ /^D/'\ncat /proc/2456/limits\nls -1 /proc/2456/fd | wc -l\ncat /proc/sys/fs/file-nr\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n  <th>État<\/th>\n  <th>Description<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>R<\/td>\n  <td>Exécutable<\/td>\n<\/tr>\n<tr>\n  <td>S<\/td>\n  <td>Attente interruptible<\/td>\n<\/tr>\n<tr>\n  <td>D<\/td>\n  <td>Attente non interruptible<\/td>\n<\/tr>\n<tr>\n  <td>Z<\/td>\n  <td>Zombie<\/td>\n<\/tr>\n<tr>\n  <td>T<\/td>\n  <td>Suspendu<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Un zombie a terminé mais son parent n’a pas récupéré son statut. Un état D persistant peut indiquer un problème I/O ou NFS. Trop de descripteurs entraîne « Too many open files ».<\/p>\n",

        {

          body: "<pre><code class=\"language-bash\">systemctl list-units --type=service --state=running\nsystemctl --failed\nsystemctl status nginx --no-pager\nsystemctl is-active nginx\nsystemctl is-enabled nginx\nsystemctl show nginx -p MainPID -p NRestarts -p ExecMainStatus -p ActiveEnterTimestamp\nsystemctl list-dependencies nginx\njournalctl -u nginx -n 100 --no-pager\njournalctl -u nginx --since '1 hour ago'\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n  <th>État<\/th>\n  <th>Signification<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>active (running)<\/td>\n  <td>En cours<\/td>\n<\/tr>\n<tr>\n  <td>active (exited)<\/td>\n  <td>Commande terminée, unité active<\/td>\n<\/tr>\n<tr>\n  <td>inactive<\/td>\n  <td>Inactif, parfois attendu<\/td>\n<\/tr>\n<tr>\n  <td>failed<\/td>\n  <td>Échec<\/td>\n<\/tr>\n<tr>\n  <td>activating/deactivating<\/td>\n  <td>Transition<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Services possibles : sshd, nginx, httpd, mssql-server, grafana-server, jenkins, docker, chronyd, rsyslog, crond. WSO2 et Talend dépendent de l’installation. Diagnostic : statut → logs → ressources et ports → cause → validation → correction → contrôle.<\/p>\n",
          text: "```bash\nsystemctl list-units --type=service --state=running\nsystemctl --failed\nsystemctl status nginx --no-pager\nsystemctl is-active nginx\nsystemctl is-enabled nginx\nsystemctl show nginx -p MainPID -p NRestarts -p ExecMainStatus -p ActiveEnterTimestamp\nsystemctl list-dependencies nginx\njournalctl -u nginx -n 100 --no-pager\njournalctl -u nginx --since '1 hour ago'\n```\n| État | Signification |\n|---|---|\n| active (running) | En cours |\n| active (exited) | Commande terminée, unité active |\n| inactive | Inactif, parfois attendu |\n| failed | Échec |\n| activating/deactivating | Transition |\nServices possibles : sshd, nginx, httpd, mssql-server, grafana-server, jenkins, docker, chronyd, rsyslog, crond. WSO2 et Talend dépendent de l’installation. Diagnostic : statut → logs → ressources et ports → cause → validation → correction → contrôle.\n",

        {
          title: "Logs système et applicatifs",
          body: "<table>\n<thead>\n<tr>\n  <th>Chemin<\/th>\n  <th>Contenu<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>/var/log/messages<\/td>\n  <td>Système<\/td>\n<\/tr>\n<tr>\n  <td>/var/log/secure<\/td>\n  <td>Authentification<\/td>\n<\/tr>\n<tr>\n  <td>/var/log/cron<\/td>\n  <td>Tâches planifiées<\/td>\n<\/tr>\n<tr>\n  <td>/var/log/audit/audit.log<\/td>\n  <td>Audit<\/td>\n<\/tr>\n<tr>\n  <td>/var/log/dnf.log<\/td>\n  <td>Packages<\/td>\n<\/tr>\n<tr>\n  <td>/var/log/nginx/ et /var/log/httpd/<\/td>\n  <td>Serveurs web<\/td>\n<\/tr>\n<tr>\n  <td>/var/log/journal/<\/td>\n  <td>Journal persistant<\/td>\n<\/tr>\n<tr>\n  <td>/var/opt/mssql/log/<\/td>\n  <td>SQL Server<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<pre><code class=\"language-bash\">head -n 20 /var/log/messages\ntail -n 100 /var/log/messages\ntail -f /var/log/messages\ntail -F /var/log/messages\ngrep -inE 'error|fatal|failed|exception' /var/log/messages\ngrep -inE -C 5 'error|fatal|exception' application.log\nzgrep -inE 'error|exception|failed' application.log.gz\nzless application.log.gz\njournalctl -p err -b\njournalctl -p err --since '24 hours ago'\njournalctl --since '2026-11-26 08:00:00' --until '2026-11-26 09:00:00'\njournalctl -k -p warning --since today\ndu -sh /var/log\ndu -xhd1 /var/log | sort -hr\njournalctl --disk-usage\n<\/code><\/pre>\n<p>DEBUG : détails ; INFO : fonctionnement ; WARNING : anomalie ; ERROR : échec ; CRITICAL/FATAL : grave. Les chemins varient selon configuration.<\/p>\n<table>\n<thead>\n<tr>\n  <th>Erreur<\/th>\n  <th>Piste<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>No space left on device<\/td>\n  <td>Disque/inodes<\/td>\n<\/tr>\n<tr>\n  <td>Permission denied<\/td>\n  <td>ACL/SELinux/permissions<\/td>\n<\/tr>\n<tr>\n  <td>Connection refused/timed out<\/td>\n  <td>Réseau/service<\/td>\n<\/tr>\n<tr>\n  <td>Out of memory<\/td>\n  <td>RAM<\/td>\n<\/tr>\n<tr>\n  <td>Too many open files<\/td>\n  <td>Descripteurs<\/td>\n<\/tr>\n<tr>\n  <td>Read-only file system<\/td>\n  <td>Montage/stockage<\/td>\n<\/tr>\n<tr>\n  <td>Address already in use<\/td>\n  <td>Conflit port<\/td>\n<\/tr>\n<tr>\n  <td>Segmentation fault<\/td>\n  <td>Crash<\/td>\n<\/tr>\n<tr>\n  <td>I/O error<\/td>\n  <td>Stockage<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n",
          text: "| Chemin | Contenu |\n|---|---|\n| /var/log/messages | Système |\n| /var/log/secure | Authentification |\n| /var/log/cron | Tâches planifiées |\n| /var/log/audit/audit.log | Audit |\n| /var/log/dnf.log | Packages |\n| /var/log/nginx/ et /var/log/httpd/ | Serveurs web |\n| /var/log/journal/ | Journal persistant |\n| /var/opt/mssql/log/ | SQL Server |\n```bash\nhead -n 20 /var/log/messages\ntail -n 100 /var/log/messages\ntail -f /var/log/messages\ntail -F /var/log/messages\ngrep -inE 'error|fatal|failed|exception' /var/log/messages\ngrep -inE -C 5 'error|fatal|exception' application.log\nzgrep -inE 'error|exception|failed' application.log.gz\nzless application.log.gz\njournalctl -p err -b\njournalctl -p err --since '24 hours ago'\njournalctl --since '2026-11-26 08:00:00' --until '2026-11-26 09:00:00'\njournalctl -k -p warning --since today\ndu -sh /var/log\ndu -xhd1 /var/log | sort -hr\njournalctl --disk-usage\n```\nDEBUG : détails ; INFO : fonctionnement ; WARNING : anomalie ; ERROR : échec ; CRITICAL/FATAL : grave. Les chemins varient selon configuration.\n| Erreur | Piste |\n|---|---|\n| No space left on device | Disque/inodes |\n| Permission denied | ACL/SELinux/permissions |\n| Connection refused/timed out | Réseau/service |\n| Out of memory | RAM |\n| Too many open files | Descripteurs |\n| Read-only file system | Montage/stockage |\n| Address already in use | Conflit port |\n| Segmentation fault | Crash |\n| I/O error | Stockage |\n",

        {
          title: "Rotation et compression",
          body: '<pre><code class="language-bash">cat /etc/logrotate.conf\nls -l /etc/logrotate.d/\nlogrotate -d /etc/logrotate.conf\n<\/code><\/pre>\n<p>Simulation sans modification. Exemple de configuration à adapter à la réouverture des logs du service :<\/p>\n<pre><code class="language-text">/opt/application/logs/*.log {\n    daily\n    rotate 30\n    compress\n    delaycompress\n    missingok\n    notifempty\n    dateext\n}\n<\/code><\/pre>\n<p>Rotation quotidienne, 30 rotations, compression différée, fichiers manquants ignorés, fichiers vides non tournés, suffixe daté.<\/p>\n<h2>Compression et archives (après validation)<\/h2>\n<pre><code class="language-bash">gzip application-20261101.log\ngzip -k application-20261101.log\ngunzip application-20261101.log.gz\ngzip -t application-20261101.log.gz\ntar -czf logs-novembre.tar.gz logs-novembre/\ntar -tzf logs-novembre.tar.gz\nzip -r logs-novembre.zip logs-novembre/\nunzip -t logs-novembre.zip\n<\/code><\/pre>\n<p>Prévoir l’espace supplémentaire ; préférer un volume approuvé si le disque est presque plein.<\/p>\n<h2>Purge journald (action corrective)<\/h2>\n<pre><code class="language-bash">journalctl --disk-usage\n# Après validation de la rétention :\njournalctl --rotate --vacuum-size=1G\n# Alternative selon politique :\njournalctl --rotate --vacuum-time=30d\njournalctl --disk-usage\ndf -h\n<\/code><\/pre>\n<p>La rotation archive les journaux actifs, puis vacuum supprime les archives anciennes selon la limite. Ce n’est pas une purge de tous les logs /var/log.<\/p>\n',
          text: "```bash\ncat /etc/logrotate.conf\nls -l /etc/logrotate.d/\nlogrotate -d /etc/logrotate.conf\n```\nSimulation sans modification. Exemple de configuration à adapter à la réouverture des logs du service :\n```text\n/opt/application/logs/*.log {\n    daily\n    rotate 30\n    compress\n    delaycompress\n    missingok\n    notifempty\n    dateext\n}\n```\nRotation quotidienne, 30 rotations, compression différée, fichiers manquants ignorés, fichiers vides non tournés, suffixe daté.\n## Compression et archives (après validation)\n```bash\ngzip application-20261101.log\ngzip -k application-20261101.log\ngunzip application-20261101.log.gz\ngzip -t application-20261101.log.gz\ntar -czf logs-novembre.tar.gz logs-novembre/\ntar -tzf logs-novembre.tar.gz\nzip -r logs-novembre.zip logs-novembre/\nunzip -t logs-novembre.zip\n```\nPrévoir l’espace supplémentaire ; préférer un volume approuvé si le disque est presque plein.\n## Purge journald (action corrective)\n```bash\njournalctl --disk-usage\n# Après validation de la rétention :\njournalctl --rotate --vacuum-size=1G\n# Alternative selon politique :\njournalctl --rotate --vacuum-time=30d\njournalctl --disk-usage\ndf -h\n```\nLa rotation archive les journaux actifs, puis vacuum supprime les archives anciennes selon la limite. Ce n’est pas une purge de tous les logs /var/log.\n",
          id: "chapitre-14",

        {
          title: "Script Bash de collecte",
          body: "<p>Ce script de base ne redémarre ni ne supprime rien. Tester hors production ; certains contrôles nécessitent des privilèges et des packages. Les sorties peuvent contenir des données sensibles.<\/p>\n<pre><code class=\"language-bash\">#!/bin/bash\nexport LC_ALL=C\nsection() { printf '\\n==== %s ====\\n' &quot;$1&quot;; }\nsection 'Identification'\ndate; hostname; whoami; cat /etc/os-release; uname -r; uptime\nsection 'CPU'\nnproc; cat /proc/loadavg; top -bn1 | head -n 15\nsection 'RAM / Swap'\nfree -h; vmstat 1 3; swapon --show\nawk '/^MemTotal:/ {t=$2} /^MemAvailable:/ {a=$2} END {if(t&gt;0) {p=100*a/t; printf &quot;Available: %.2f%%\\n&quot;,p; if(p&lt;15) print &quot;WARNING: RAM&quot;}}' /proc/meminfo\nsection 'Disques / Inodes'\ndf -hT; df -i\ndf -Pl | awk 'NR&gt;1 {u=$5; gsub(/%/,&quot;&quot;,u); if(u&gt;=90) print &quot;CRITICAL&quot;,$6,u&quot;%&quot;; else if(u&gt;=80) print &quot;WARNING&quot;,$6,u&quot;%&quot;}'\ndf -Pil | awk 'NR&gt;1 {u=$5; gsub(/%/,&quot;&quot;,u); if(u~/^[0-9]+$/ &amp;&amp; u&gt;=80) print &quot;WARNING INODES&quot;,$6,u&quot;%&quot;}'\nsection 'Processus'\nps -eo pid,user,comm,%cpu,%mem --sort=-%cpu | head -n 11\nps -eo pid,user,comm,%cpu,%mem --sort=-%mem | head -n 11\nsection 'Services / Réseau'\nsystemctl --failed --no-pager; ip -br addr; ip route; ss -s; ss -tulnp\nsection 'Logs'\njournalctl -p err --since '24 hours ago' --no-pager -n 50\njournalctl -k --since '24 hours ago' --no-pager | grep -Ei 'out of memory|oom-kill|killed process'\njournalctl --disk-usage\nsection 'Horloge / Sessions / Timers'\ntimedatectl status; who; systemctl list-timers --all --no-pager\nsection 'I/O'\nif command -v iostat &gt;/dev/null; then iostat -xz 1 3; else echo 'iostat absent'; fi\nsection 'Conteneurs'\nif command -v docker &gt;/dev/null; then docker ps -a; docker stats --no-stream; fi\nif command -v podman &gt;/dev/null; then podman ps -a; podman stats --no-stream; fi\nsection 'Fin'; date\n<\/code><\/pre>\n<pre><code class=\"language-bash\">vi health-check.sh\nchmod 750 health-check.sh\n./health-check.sh\numask 077\n./health-check.sh 2&gt;&amp;1 | tee &quot;healthcheck-$(hostname)-$(date +%F_%H%M).txt&quot;\n<\/code><\/pre>\n<p>Limites : pas de validation fonctionnelle, ni de restauration, ni de contrôle exhaustif des certificats et dépendances. Les échecs de commandes doivent être traités comme contrôles non conclusifs.<\/p>\n",
          text: "Ce script de base ne redémarre ni ne supprime rien. Tester hors production ; certains contrôles nécessitent des privilèges et des packages. Les sorties peuvent contenir des données sensibles.\n```bash\n#!/bin/bash\nexport LC_ALL=C\nsection() { printf '\\n==== %s ====\\n' \"$1\"; }\nsection 'Identification'\ndate; hostname; whoami; cat /etc/os-release; uname -r; uptime\nsection 'CPU'\nnproc; cat /proc/loadavg; top -bn1 | head -n 15\nsection 'RAM / Swap'\nfree -h; vmstat 1 3; swapon --show\nawk '/^MemTotal:/ {t=$2} /^MemAvailable:/ {a=$2} END {if(t>0) {p=100*a/t; printf \"Available: %.2f%%\\n\",p; if(p<15) print \"WARNING: RAM\"}}' /proc/meminfo\nsection 'Disques / Inodes'\ndf -hT; df -i\ndf -Pl | awk 'NR>1 {u=$5; gsub(/%/,\"\",u); if(u>=90) print \"CRITICAL\",$6,u\"%\"; else if(u>=80) print \"WARNING\",$6,u\"%\"}'\ndf -Pil | awk 'NR>1 {u=$5; gsub(/%/,\"\",u); if(u~/^[0-9]+$/ && u>=80) print \"WARNING INODES\",$6,u\"%\"}'\nsection 'Processus'\nps -eo pid,user,comm,%cpu,%mem --sort=-%cpu | head -n 11\nps -eo pid,user,comm,%cpu,%mem --sort=-%mem | head -n 11\nsection 'Services / Réseau'\nsystemctl --failed --no-pager; ip -br addr; ip route; ss -s; ss -tulnp\nsection 'Logs'\njournalctl -p err --since '24 hours ago' --no-pager -n 50\njournalctl -k --since '24 hours ago' --no-pager | grep -Ei 'out of memory|oom-kill|killed process'\njournalctl --disk-usage\nsection 'Horloge / Sessions / Timers'\ntimedatectl status; who; systemctl list-timers --all --no-pager\nsection 'I/O'\nif command -v iostat >/dev/null; then iostat -xz 1 3; else echo 'iostat absent'; fi\nsection 'Conteneurs'\nif command -v docker >/dev/null; then docker ps -a; docker stats --no-stream; fi\nif command -v podman >/dev/null; then podman ps -a; podman stats --no-stream; fi\nsection 'Fin'; date\n```\n```bash\nvi health-check.sh\nchmod 750 health-check.sh\n./health-check.sh\numask 077\n./health-check.sh 2>&1 | tee \"healthcheck-$(hostname)-$(date +%F_%H%M).txt\"\n```\nLimites : pas de validation fonctionnelle, ni de restauration, ni de contrôle exhaustif des certificats et dépendances. Les échecs de commandes doivent être traités comme contrôles non conclusifs.\n",

if, à adapter aux observations réelles.<\/p>\n",
          text: "## Informations générales\nDate, heure, serveur, environnement, OS, responsable et statut global.\n| Indicateur | Résultat fictif | Statut |\n|---|---|---|\n| Disponibilité | Accessible | OK |\n| Uptime | 125 jours | OK |\n| CPU | 25 % | OK |\n| Load | 0.85 / 0.90 / 1.02 | OK |\n| RAM disponible | 45 % | OK |\n| Swap | 5 % | OK |\n| / | 45 % | OK |\n| /var | 92 % | CRITICAL |\n| Inodes | 15 % | OK |\n| Services, réseau | Opérationnels | OK |\n| Logs | Aucune erreur critique récente | OK |\n| Backup, NTP | Vérifiés | OK |\n## Anomalies et diagnostic\nPartition /var à 92 %, accumulation de logs archivés. Analyse des tailles et de la rétention.\n## Actions réalisées\nVérification des partitions, analyse des fichiers, identification des archives, validation du périmètre, nettoyage ciblé autorisé, mesure après intervention, contrôle des services.\n| Indicateur | Avant | Après |\n|---|---|---|\n| /var | 92 % | 65 % |\n| Services | Actifs | Actifs |\n## Recommandations et conclusion\nContrôler logrotate, suivre croissance et respecter la rétention. Statut final OK si tous les contrôles attendus sont concluants. Exemple fictif, à adapter aux observations réelles.\n",

        {
          title: "Cheatsheet et routine quotidienne",
          body: "<pre><code class=\"language-bash\">hostname; date; uptime\ntop -bn1 | head -n 15\nfree -h\ndf -hT; df -i\nsystemctl --failed\nip -br addr; ss -s\njournalctl -p err --since '24 hours ago' -n 50\njournalctl --disk-usage\ntimedatectl status\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n  <th>Commande<\/th>\n  <th>Usage<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>nproc, mpstat, sar<\/td>\n  <td>CPU et historique<\/td>\n<\/tr>\n<tr>\n  <td>vmstat, free<\/td>\n  <td>Mémoire et swap<\/td>\n<\/tr>\n<tr>\n  <td>df, du, find, lsblk, findmnt<\/td>\n  <td>Stockage<\/td>\n<\/tr>\n<tr>\n  <td>lsof +L1, iostat<\/td>\n  <td>Fichiers ouverts, I/O<\/td>\n<\/tr>\n<tr>\n  <td>ps, systemctl, journalctl<\/td>\n  <td>Processus, services, logs<\/td>\n<\/tr>\n<tr>\n  <td>tail, grep, zgrep<\/td>\n  <td>Analyse des journaux<\/td>\n<\/tr>\n<tr>\n  <td>ip, ss, ping, nc, curl, dig<\/td>\n  <td>Réseau<\/td>\n<\/tr>\n<tr>\n  <td>crontab, timedatectl<\/td>\n  <td>Tâches, temps<\/td>\n<\/tr>\n<tr>\n  <td>getenforce, openssl<\/td>\n  <td>Sécurité<\/td>\n<\/tr>\n<tr>\n  <td>docker stats, gzip, tar<\/td>\n  <td>Conteneurs, archives<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n",
          text: "```bash\nhostname; date; uptime\ntop -bn1 | head -n 15\nfree -h\ndf -hT; df -i\nsystemctl --failed\nip -br addr; ss -s\njournalctl -p err --since '24 hours ago' -n 50\njournalctl --disk-usage\ntimedatectl status\n```\n| Commande | Usage |\n|---|---|\n| nproc, mpstat, sar | CPU et historique |\n| vmstat, free | Mémoire et swap |\n| df, du, find, lsblk, findmnt | Stockage |\n| lsof +L1, iostat | Fichiers ouverts, I/O |\n| ps, systemctl, journalctl | Processus, services, logs |\n| tail, grep, zgrep | Analyse des journaux |\n| ip, ss, ping, nc, curl, dig | Réseau |\n| crontab, timedatectl | Tâches, temps |\n| getenforce, openssl | Sécurité |\n| docker stats, gzip, tar | Conteneurs, archives |\n",
          id: "chapitre-30",
        },
        {
          title: "Références et conclusion",
          body: '<pre><code class="language-bash">man top\nman free\nman df\nman du\nman find\nman systemctl\nman journalctl\nman ss\nman lsof\nman iostat\nman logrotate\nman openssl\n<\/code><\/pre>\n<p>Observer → Analyser → Identifier → Faire valider → Corriger → Vérifier → Documenter. Adapter les chemins, services, seuils et règles aux environnements réels. Ce guide pédagogique n’est pas une procédure officielle validée par Yas.<\/p>\n',
          text: "```bash\nman top\nman free\nman df\nman du\nman find\nman systemctl\nman journalctl\nman ss\nman lsof\nman iostat\nman logrotate\nman openssl\n```\nObserver → Analyser → Identifier → Faire valider → Corriger → Vérifier → Documenter. Adapter les chemins, services, seuils et règles aux environnements réels. Ce guide pédagogique n’est pas une procédure officielle validée par Yas.\n",
          id: "chapitre-31",
        },
      ];
      const groups = [
        [0, "Démarrage"],
        [3, "Ressources système"],
        [6, "Stockage"],
        [9, "Réseau & services"],
        [12, "Logs & maintenance"],
        [15, "Cas pratiques"],
        [17, "Sécurité & exploitation"],
        [21, "Diagnostics avancés"],
        [26, "Procédures & références"],
      ];
      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        s.replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const link = (i, label) =>
        `<a href="#${docs[i].id}">${label || esc(docs[i].title)}</a>`;
      function store(k, v) {
        try {
          localStorage.setItem(k, v);
        } catch {}
      }
      function read(k) {
        try {
          return localStorage.getItem(k);
        } catch {
          return null;
        }
      }
      function nav() {
        let out = "";
        docs.forEach((d, i) => {
          let g = groups.find((x) => x[0] === i);
          if (g) out += `<div class="side-label">${g[1]}</div>`;
          out += `<a class="nav" href="#${d.id}" data-id="${d.id}">${esc(d.title)}</a>`;
        });
        $("sidebar").innerHTML = out;
      }
      nav();
      function show() {
        let i = docs.findIndex((d) => d.id === location.hash.slice(1));
        if (i < 0) i = 0;
        let d = docs[i];
        document
          .querySelectorAll(".nav")
          .forEach((a) => a.classList.toggle("active", a.dataset.id === d.id));
        $("crumb").textContent =
          "Documentation  /  Server Health Check  /  " + d.title;
        $("hero").innerHTML =
          i === 0
            ? `<div class="hero"><div class="eyebrow">Guide opérationnel · IT Support</div><h1>Server Health Check</h1><p>Le guide de référence pour diagnostiquer, maintenir et sécuriser les serveurs Linux.</p><div class="meta"><span>Red Hat Enterprise Linux</span><span>Support N1 / N2</span><span>${docs.length} chapitres</span></div></div><div class="quickgrid">${link(6, "Stockage & partitions<small>Analyser les disques et libérer de l’espace</small>")}${link(11, "Services systemd<small>Diagnostiquer les services en échec</small>")}${link(12, "Logs système<small>Identifier les erreurs et événements</small>")}${link(26, "Checklist quotidienne<small>Effectuer les contrôles de routine</small>")}</div>`
            : "";
        $("article").innerHTML =
          `<div class="eyebrow">Chapitre ${String(i + 1).padStart(2, "0")} / ${docs.length}</div><h1>${esc(d.title)}</h1>` +
          d.body;
        if ([13, 15, 16].includes(i))
          $("article").insertAdjacentHTML(
            "afterbegin",
            '<div class="notice">Production : les opérations de suppression ou de rotation doivent être validées avant exécution.</div>',
          );
        document.querySelectorAll("pre").forEach((pre) => {
          let w = document.createElement("div");
          w.className = "codewrap";
          pre.before(w);
          w.innerHTML =
            '<div class="codebar"><span>TERMINAL / BASH</span><button class="copy">Copier</button></div>';
          w.append(pre);
          w.querySelector("button").onclick = async (e) => {
            try {
              await navigator.clipboard.writeText(pre.innerText);
            } catch {
              let t = document.createElement("textarea");
              t.value = pre.innerText;
              document.body.append(t);
              t.select();
              document.execCommand("copy");
              t.remove();
            }
            e.target.textContent = "Copié ✓";
            setTimeout(() => (e.target.textContent = "Copier"), 1500);
          };
        });
        document.querySelectorAll("article table").forEach((t) => {
          let w = document.createElement("div");
          w.className = "tablewrap";
          t.before(w);
          w.append(t);
        });
        if (d.title === "Fréquence et checklist") checklist();
        if (d.title === "Tendances et anticipation") calc();
        if (d.title === "CPU et Load Average") loadcalc();
        let toc = "<strong>Sur cette page</strong>";
        document.querySelectorAll("article h2").forEach((h, j) => {
          h.id = "sub-" + j;
          toc += `<a href="#${d.id}" data-sub="${h.id}">${esc(h.textContent)}</a>`;
        });
        toc +=
          '<a href="#' +
          d.id +
          '" data-sub="top">↑ Retour en haut</a><hr style="border:0;border-top:1px solid var(--line)"><a href="#chapitre-1">← Accueil</a><a href="#" id="print">Imprimer le chapitre</a>';
        $("toc").innerHTML = toc;
        $("toc")
          .querySelectorAll("[data-sub]")
          .forEach(
            (a) =>
              (a.onclick = (e) => {
                e.preventDefault();
                a.dataset.sub === "top"
                  ? window.scrollTo({ top: 0, behavior: "smooth" })
                  : document
                      .getElementById(a.dataset.sub)
                      .scrollIntoView({ behavior: "smooth", block: "center" });
              }),
          );
        $("print").onclick = (e) => {
          e.preventDefault();
          window.print();
        };
        $("pager").innerHTML =
          (i
            ? link(i - 1, "<small>← Précédent</small>" + esc(docs[i - 1].title))
            : "<span></span>") +
          (i < docs.length - 1
            ? link(i + 1, "<small>Suivant →</small>" + esc(docs[i + 1].title))
            : "");
        $("sidebar").classList.remove("open");
        window.scrollTo(0, 0);
      }
      function checklist() {
        let items = [
          "Identification du serveur",
          "Uptime et horloge",
          "CPU et load average",
          "RAM et swap",
          "Partitions et inodes",
          "Montages critiques",
          "Services attendus",
          "Interfaces et ports",
          "Logs et OOM",
          "Sauvegardes et tâches",
          "Anomalies et preuves",
          "Actions validées et rapport",
        ];
        let saved = JSON.parse(read("yas-checks") || "[]");
        let div = document.createElement("div");
        div.className = "tools checklist";
        div.innerHTML =
          '<h2>Checklist interactive</h2><p id="progress"></p>' +
          items
            .map(
              (v, i) =>
                `<label><input type="checkbox" ${saved.includes(i) ? "checked" : ""}>${v}</label>`,
            )
            .join("") +
          '<button class="iconbtn" id="reset">Réinitialiser</button>';
        $("article").append(div);
        let boxes = [...div.querySelectorAll("input")];
        function update() {
          let checked = boxes.flatMap((b, i) => (b.checked ? [i] : []));
          store("yas-checks", JSON.stringify(checked));
          $("progress").textContent =
            checked.length + " / " + items.length + " contrôles réalisés";
        }
        boxes.forEach((b) => (b.onchange = update));
        $("reset").onclick = () => {
          boxes.forEach((b) => (b.checked = false));
          update();
        };
        update();
      }
      function tool(title, fields, fn) {
        let div = document.createElement("div");
        div.className = "tools";
        div.innerHTML =
          "<h2>" +
          title +
          '</h2><div class="toolgrid">' +
          fields
            .map(
              ([n, v]) =>
                `<label>${n}<input type="number" min="0" step="any" value="${v}"></label>`,
            )
            .join("") +
          '</div><div class="out"></div>';
        $("article").append(div);
        let inputs = [...div.querySelectorAll("input")];
        function update() {
          div.querySelector(".out").textContent = fn(
            inputs.map((x) => Number(x.value)),
          );
        }
        inputs.forEach((x) => (x.oninput = update));
        update();
      }
      function calc() {
        tool(
          "Calculateur de saturation",
          [
            ["Capacité (Go)", 500],
            ["Utilisé (Go)", 435],
            ["Croissance (Go/j)", 10],
            ["Seuil (%)", 90],
          ],
          ([c, u, g, t]) =>
            c > 0 && g > 0 && u >= 0 && u <= c && t > 0 && t <= 100
              ? Math.max(0, ((c * t) / 100 - u) / g).toFixed(1) +
                " jour(s) avant seuil"
              : "Valeurs invalides",
        );
      }
      function loadcalc() {
        tool(
          "Analyseur de charge",
          [
            ["CPU logiques", 8],
            ["Load average", 2.5],
          ],
          ([c, l]) =>
            c > 0 && l >= 0
              ? ((100 * l) / c).toFixed(1) + " % de charge relative"
              : "Valeurs invalides",
        );
      }
      function search() {
        let q = $("search").value.trim().toLowerCase();
        $("results").classList.toggle("hidden", !q);
        if (!q) return;
        let matches = docs
          .map((d, i) => ({
            d,
            i,
            score:
              (d.title.toLowerCase().includes(q) ? 10 : 0) +
              (d.text.toLowerCase().includes(q) ? 1 : 0),
          }))
          .filter((x) => x.score)
          .sort((a, b) => b.score - a.score);
        $("results").innerHTML = matches.length
          ? matches
              .map(({ d, i }) =>
                link(
                  i,
                  esc(d.title) + "<small>Chapitre " + (i + 1) + "</small>",
                ),
              )
              .join("")
          : '<div style="padding:14px">Aucun résultat</div>';
        $("results")
          .querySelectorAll("a")
          .forEach(
            (a) =>
              (a.onclick = () => {
                $("search").value = "";
                $("results").classList.add("hidden");
              }),
          );
      }
      $("search").oninput = search;
      $("search").onkeydown = (e) => {
        if (e.key === "Escape") $("results").classList.add("hidden");
        if (e.key === "Enter") $("results").querySelector("a")?.click();
      };
      document.addEventListener("click", (e) => {
        if (!e.target.closest(".search")) $("results").classList.add("hidden");
      });
      document.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === "k") {
          e.preventDefault();
          $("search").focus();
        }
      });
      $("menu").onclick = () => $("sidebar").classList.toggle("open");
      if (read("yas-theme") === "dark") document.body.classList.add("dark");
      $("theme").onclick = () => {
        document.body.classList.toggle("dark");
        store(
          "yas-theme",
          document.body.classList.contains("dark") ? "dark" : "light",
        );
      };
      window.addEventListener("hashchange", show);
      show();
    </script>
