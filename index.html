el physique contrôler RAID, température, ventilateurs et alimentations. Ne pas supprimer les IPC avec ipcrm sans validation. Core dumps peuvent contenir des secrets.<\/p>\n", "text": "```bash\ncat /proc/pressure/cpu\ncat /proc/pressure/memory\ncat /proc/pressure/io\nulimit -a\nsysctl kernel.threads-max\nsystemctl show nginx -p LimitNOFILE -p TasksCurrent -p TasksMax\ncoredumpctl list\ncoredumpctl info\nfindmnt -t nfs,nfs4\nnfsstat -m\njournalctl -k --since '24 hours ago' | grep -Ei 'hardware error|machine check|mce|edac'\nipcs -a\n```\nPSI mesure les retards liés à la contention. ulimit concerne la session actuelle. NFS bloqué peut entraîner des tâches D. Sur matériel physique contrôler RAID, température, ventilateurs et alimentations. Ne pas supprimer les IPC avec ipcrm sans validation. Core dumps peuvent contenir des secrets.\n", "id": "chapitre-24", "lead": "Approfondir uniquement si le contrôle initial indique une anomalie ou si le contexte le justifie.", "example": null}, {"title": "Tendances et anticipation", "body": "<p>Observer les métriques dans le temps : exemple d’utilisation disque sur cinq jours : 62, 67, 73, 81, 87 %. Estimer le délai avant seuil : (capacité × seuil / 100 − espace utilisé) / croissance quotidienne, si croissance constante positive. Corréler avec événements et cycles de charge.<\/p>\n", "text": "Observer les métriques dans le temps : exemple d’utilisation disque sur cinq jours : 62, 67, 73, 81, 87 %. Estimer le délai avant seuil : (capacité × seuil / 100 − espace utilisé) / croissance quotidienne, si croissance constante positive. Corréler avec événements et cycles de charge.\n", "id": "chapitre-25", "lead": "Comparer les mesures dans le temps afin d’anticiper une saturation, plutôt que réagir au dernier moment.", "example": null}, {"title": "Script Bash de collecte", "body": "<p>Ce script de base ne redémarre ni ne supprime rien. Tester hors production ; certains contrôles nécessitent des privilèges et des packages. Les sorties peuvent contenir des données sensibles.<\/p>\n<pre><code class=\"language-bash\">#!/bin/bash\nexport LC_ALL=C\nsection() { printf '\\n==== %s ====\\n' &quot;$1&quot;; }\nsection 'Identification'\ndate; hostname; whoami; cat /etc/os-release; uname -r; uptime\nsection 'CPU'\nnproc; cat /proc/loadavg; top -bn1 | head -n 15\nsection 'RAM / Swap'\nfree -h; vmstat 1 3; swapon --show\nawk '/^MemTotal:/ {t=$2} /^MemAvailable:/ {a=$2} END {if(t&gt;0) {p=100*a/t; printf &quot;Available: %.2f%%\\n&quot;,p; if(p&lt;15) print &quot;WARNING: RAM&quot;}}' /proc/meminfo\nsection 'Disques / Inodes'\ndf -hT; df -i\ndf -Pl | awk 'NR&gt;1 {u=$5; gsub(/%/,&quot;&quot;,u); if(u&gt;=90) print &quot;CRITICAL&quot;,$6,u&quot;%&quot;; else if(u&gt;=80) print &quot;WARNING&quot;,$6,u&quot;%&quot;}'\ndf -Pil | awk 'NR&gt;1 {u=$5; gsub(/%/,&quot;&quot;,u); if(u~/^[0-9]+$/ &amp;&amp; u&gt;=80) print &quot;WARNING INODES&quot;,$6,u&quot;%&quot;}'\nsection 'Processus'\nps -eo pid,user,comm,%cpu,%mem --sort=-%cpu | head -n 11\nps -eo pid,user,comm,%cpu,%mem --sort=-%mem | head -n 11\nsection 'Services / Réseau'\nsystemctl --failed --no-pager; ip -br addr; ip route; ss -s; ss -tulnp\nsection 'Logs'\njournalctl -p err --since '24 hours ago' --no-pager -n 50\njournalctl -k --since '24 hours ago' --no-pager | grep -Ei 'out of memory|oom-kill|killed process'\njournalctl --disk-usage\nsection 'Horloge / Sessions / Timers'\ntimedatectl status; who; systemctl list-timers --all --no-pager\nsection 'I/O'\nif command -v iostat &gt;/dev/null; then iostat -xz 1 3; else echo 'iostat absent'; fi\nsection 'Conteneurs'\nif command -v docker &gt;/dev/null; then docker ps -a; docker stats --no-stream; fi\nif command -v podman &gt;/dev/null; then podman ps -a; podman stats --no-stream; fi\nsection 'Fin'; date\n<\/code><\/pre>\n<pre><code class=\"language-bash\">vi health-check.sh\nchmod 750 health-check.sh\n./health-check.sh\numask 077\n./health-check.sh 2&gt;&amp;1 | tee &quot;healthcheck-$(hostname)-$(date +%F_%H%M).txt&quot;\n<\/code><\/pre>\n<p>Limites : pas de validation fonctionnelle, ni de restauration, ni de contrôle exhaustif des certificats et dépendances. Les échecs de commandes doivent être traités comme contrôles non conclusifs.<\/p>\n", "text": "Ce script de base ne redémarre ni ne supprime rien. Tester hors production ; certains contrôles nécessitent des privilèges et des packages. Les sorties peuvent contenir des données sensibles.\n```bash\n#!/bin/bash\nexport LC_ALL=C\nsection() { printf '\\n==== %s ====\\n' \"$1\"; }\nsection 'Identification'\ndate; hostname; whoami; cat /etc/os-release; uname -r; uptime\nsection 'CPU'\nnproc; cat /proc/loadavg; top -bn1 | head -n 15\nsection 'RAM / Swap'\nfree -h; vmstat 1 3; swapon --show\nawk '/^MemTotal:/ {t=$2} /^MemAvailable:/ {a=$2} END {if(t>0) {p=100*a/t; printf \"Available: %.2f%%\\n\",p; if(p<15) print \"WARNING: RAM\"}}' /proc/meminfo\nsection 'Disques / Inodes'\ndf -hT; df -i\ndf -Pl | awk 'NR>1 {u=$5; gsub(/%/,\"\",u); if(u>=90) print \"CRITICAL\",$6,u\"%\"; else if(u>=80) print \"WARNING\",$6,u\"%\"}'\ndf -Pil | awk 'NR>1 {u=$5; gsub(/%/,\"\",u); if(u~/^[0-9]+$/ && u>=80) print \"WARNING INODES\",$6,u\"%\"}'\nsection 'Processus'\nps -eo pid,user,comm,%cpu,%mem --sort=-%cpu | head -n 11\nps -eo pid,user,comm,%cpu,%mem --sort=-%mem | head -n 11\nsection 'Services / Réseau'\nsystemctl --failed --no-pager; ip -br addr; ip route; ss -s; ss -tulnp\nsection 'Logs'\njournalctl -p err --since '24 hours ago' --no-pager -n 50\njournalctl -k --since '24 hours ago' --no-pager | grep -Ei 'out of memory|oom-kill|killed process'\njournalctl --disk-usage\nsection 'Horloge / Sessions / Timers'\ntimedatectl status; who; systemctl list-timers --all --no-pager\nsection 'I/O'\nif command -v iostat >/dev/null; then iostat -xz 1 3; else echo 'iostat absent'; fi\nsection 'Conteneurs'\nif command -v docker >/dev/null; then docker ps -a; docker stats --no-stream; fi\nif command -v podman >/dev/null; then podman ps -a; podman stats --no-stream; fi\nsection 'Fin'; date\n```\n```bash\nvi health-check.sh\nchmod 750 health-check.sh\n./health-check.sh\numask 077\n./health-check.sh 2>&1 | tee \"healthcheck-$(hostname)-$(date +%F_%H%M).txt\"\n```\nLimites : pas de validation fonctionnelle, ni de restauration, ni de contrôle exhaustif des certificats et dépendances. Les échecs de commandes doivent être traités comme contrôles non conclusifs.\n", "id": "chapitre-26", "lead": "Automatiser une collecte de métriques sans modifier les services. Tester le script hors production.", "example": null}, {"title": "Fréquence et checklist", "body": "<table>\n<thead>\n<tr>\n  <th>Contrôle<\/th>\n  <th>Fréquence indicative<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Disponibilité, CPU, RAM, swap, disques, inodes<\/td>\n  <td>Quotidienne<\/td>\n<\/tr>\n<tr>\n  <td>Services, réseau, logs, backups<\/td>\n  <td>Quotidienne<\/td>\n<\/tr>\n<tr>\n  <td>I/O, rotation, certificats, tendances, mises à jour<\/td>\n  <td>Hebdomadaire ou selon anomalie<\/td>\n<\/tr>\n<tr>\n  <td>Audit sécurité<\/td>\n  <td>Selon politique / mensuelle<\/td>\n<\/tr>\n<tr>\n  <td>Tests restauration<\/td>\n  <td>Selon politique<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Checklist : identifier serveur, uptime, horloge, CPU, RAM, swap, partitions, inodes, montages, services, réseau, ports, erreurs, OOM, sauvegardes, tâches, preuves, actions validées, rapport. Une case cochée signifie contrôlé, non forcément OK.<\/p>\n", "text": "| Contrôle | Fréquence indicative |\n|---|---|\n| Disponibilité, CPU, RAM, swap, disques, inodes | Quotidienne |\n| Services, réseau, logs, backups | Quotidienne |\n| I/O, rotation, certificats, tendances, mises à jour | Hebdomadaire ou selon anomalie |\n| Audit sécurité | Selon politique / mensuelle |\n| Tests restauration | Selon politique |\nChecklist : identifier serveur, uptime, horloge, CPU, RAM, swap, partitions, inodes, montages, services, réseau, ports, erreurs, OOM, sauvegardes, tâches, preuves, actions validées, rapport. Une case cochée signifie contrôlé, non forcément OK.\n", "id": "chapitre-27", "lead": "Utiliser une routine reproductible pour ne pas oublier les vérifications essentielles.", "example": null}, {"title": "Classification et escalade", "body": "<table>\n<thead>\n<tr>\n  <th>Statut<\/th>\n  <th>Action<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>OK<\/td>\n  <td>Surveillance habituelle<\/td>\n<\/tr>\n<tr>\n  <td>WARNING<\/td>\n  <td>Surveillance renforcée<\/td>\n<\/tr>\n<tr>\n  <td>CRITICAL<\/td>\n  <td>Intervention prioritaire<\/td>\n<\/tr>\n<tr>\n  <td>DOWN<\/td>\n  <td>Procédure incident<\/td>\n<\/tr>\n<tr>\n  <td>UNKNOWN<\/td>\n  <td>Identifier le blocage<\/td>\n<\/tr>\n<tr>\n  <td>N/A<\/td>\n  <td>Non applicable<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Détecter → collecter preuves → identifier cause probable → évaluer impact → faire valider → corriger ou escalader N2/N3 → contrôler → documenter. Priorité selon impact métier, urgence et SLA.<\/p>\n<table>\n<thead>\n<tr>\n  <th>Symptôme<\/th>\n  <th>Commandes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Serveur lent<\/td>\n  <td>uptime, top, vmstat, iostat<\/td>\n<\/tr>\n<tr>\n  <td>CPU élevé<\/td>\n  <td>top, ps, mpstat<\/td>\n<\/tr>\n<tr>\n  <td>RAM saturée<\/td>\n  <td>free, ps, vmstat<\/td>\n<\/tr>\n<tr>\n  <td>Disque plein<\/td>\n  <td>df, du, find<\/td>\n<\/tr>\n<tr>\n  <td>Inodes<\/td>\n  <td>df -i, du --inodes<\/td>\n<\/tr>\n<tr>\n  <td>Espace non libéré<\/td>\n  <td>lsof +L1<\/td>\n<\/tr>\n<tr>\n  <td>Service arrêté<\/td>\n  <td>systemctl status, journalctl -u<\/td>\n<\/tr>\n<tr>\n  <td>Port inaccessible<\/td>\n  <td>ss, nc, ip route<\/td>\n<\/tr>\n<tr>\n  <td>DNS<\/td>\n  <td>getent, dig<\/td>\n<\/tr>\n<tr>\n  <td>Permissions<\/td>\n  <td>ls, namei, getfacl, ausearch<\/td>\n<\/tr>\n<tr>\n  <td>Crash Java<\/td>\n  <td>journalctl, jcmd<\/td>\n<\/tr>\n<tr>\n  <td>TLS<\/td>\n  <td>openssl<\/td>\n<\/tr>\n<tr>\n  <td>Reboot inattendu<\/td>\n  <td>last -x, journalctl -b -1<\/td>\n<\/tr>\n<tr>\n  <td>Conteneur arrêté<\/td>\n  <td>docker ps -a, inspect<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n", "text": "| Statut | Action |\n|---|---|\n| OK | Surveillance habituelle |\n| WARNING | Surveillance renforcée |\n| CRITICAL | Intervention prioritaire |\n| DOWN | Procédure incident |\n| UNKNOWN | Identifier le blocage |\n| N/A | Non applicable |\nDétecter → collecter preuves → identifier cause probable → évaluer impact → faire valider → corriger ou escalader N2/N3 → contrôler → documenter. Priorité selon impact métier, urgence et SLA.\n| Symptôme | Commandes |\n|---|---|\n| Serveur lent | uptime, top, vmstat, iostat |\n| CPU élevé | top, ps, mpstat |\n| RAM saturée | free, ps, vmstat |\n| Disque plein | df, du, find |\n| Inodes | df -i, du --inodes |\n| Espace non libéré | lsof +L1 |\n| Service arrêté | systemctl status, journalctl -u |\n| Port inaccessible | ss, nc, ip route |\n| DNS | getent, dig |\n| Permissions | ls, namei, getfacl, ausearch |\n| Crash Java | journalctl, jcmd |\n| TLS | openssl |\n| Reboot inattendu | last -x, journalctl -b -1 |\n| Conteneur arrêté | docker ps -a, inspect |\n", "id": "chapitre-28", "lead": "Qualifier les anomalies en fonction de leur impact et des procédures internes.", "example": null}, {"title": "Rapport Health Check", "body": "<h2>Informations générales<\/h2>\n<p>Date, heure, serveur, environnement, OS, responsable et statut global.<\/p>\n<table>\n<thead>\n<tr>\n  <th>Indicateur<\/th>\n  <th>Résultat fictif<\/th>\n  <th>Statut<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Disponibilité<\/td>\n  <td>Accessible<\/td>\n  <td>OK<\/td>\n<\/tr>\n<tr>\n  <td>Uptime<\/td>\n  <td>125 jours<\/td>\n  <td>OK<\/td>\n<\/tr>\n<tr>\n  <td>CPU<\/td>\n  <td>25 %<\/td>\n  <td>OK<\/td>\n<\/tr>\n<tr>\n  <td>Load<\/td>\n  <td>0.85 / 0.90 / 1.02<\/td>\n  <td>OK<\/td>\n<\/tr>\n<tr>\n  <td>RAM disponible<\/td>\n  <td>45 %<\/td>\n  <td>OK<\/td>\n<\/tr>\n<tr>\n  <td>Swap<\/td>\n  <td>5 %<\/td>\n  <td>OK<\/td>\n<\/tr>\n<tr>\n  <td>/<\/td>\n  <td>45 %<\/td>\n  <td>OK<\/td>\n<\/tr>\n<tr>\n  <td>/var<\/td>\n  <td>92 %<\/td>\n  <td>CRITICAL<\/td>\n<\/tr>\n<tr>\n  <td>Inodes<\/td>\n  <td>15 %<\/td>\n  <td>OK<\/td>\n<\/tr>\n<tr>\n  <td>Services, réseau<\/td>\n  <td>Opérationnels<\/td>\n  <td>OK<\/td>\n<\/tr>\n<tr>\n  <td>Logs<\/td>\n  <td>Aucune erreur critique récente<\/td>\n  <td>OK<\/td>\n<\/tr>\n<tr>\n  <td>Backup, NTP<\/td>\n  <td>Vérifiés<\/td>\n  <td>OK<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Anomalies et diagnostic<\/h2>\n<p>Partition /var à 92 %, accumulation de logs archivés. Analyse des tailles et de la rétention.<\/p>\n<h2>Actions réalisées<\/h2>\n<p>Vérification des partitions, analyse des fichiers, identification des archives, validation du périmètre, nettoyage ciblé autorisé, mesure après intervention, contrôle des services.<\/p>\n<table>\n<thead>\n<tr>\n  <th>Indicateur<\/th>\n  <th>Avant<\/th>\n  <th>Après<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>/var<\/td>\n  <td>92 %<\/td>\n  <td>65 %<\/td>\n<\/tr>\n<tr>\n  <td>Services<\/td>\n  <td>Actifs<\/td>\n  <td>Actifs<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Recommandations et conclusion<\/h2>\n<p>Contrôler logrotate, suivre croissance et respecter la rétention. Statut final OK si tous les contrôles attendus sont concluants. Exemple fictif, à adapter aux observations réelles.<\/p>\n", "text": "## Informations générales\nDate, heure, serveur, environnement, OS, responsable et statut global.\n| Indicateur | Résultat fictif | Statut |\n|---|---|---|\n| Disponibilité | Accessible | OK |\n| Uptime | 125 jours | OK |\n| CPU | 25 % | OK |\n| Load | 0.85 / 0.90 / 1.02 | OK |\n| RAM disponible | 45 % | OK |\n| Swap | 5 % | OK |\n| / | 45 % | OK |\n| /var | 92 % | CRITICAL |\n| Inodes | 15 % | OK |\n| Services, réseau | Opérationnels | OK |\n| Logs | Aucune erreur critique récente | OK |\n| Backup, NTP | Vérifiés | OK |\n## Anomalies et diagnostic\nPartition /var à 92 %, accumulation de logs archivés. Analyse des tailles et de la rétention.\n## Actions réalisées\nVérification des partitions, analyse des fichiers, identification des archives, validation du périmètre, nettoyage ciblé autorisé, mesure après intervention, contrôle des services.\n| Indicateur | Avant | Après |\n|---|---|---|\n| /var | 92 % | 65 % |\n| Services | Actifs | Actifs |\n## Recommandations et conclusion\nContrôler logrotate, suivre croissance et respecter la rétention. Statut final OK si tous les contrôles attendus sont concluants. Exemple fictif, à adapter aux observations réelles.\n", "id": "chapitre-29", "lead": "Consigner les constats, les preuves, les actions autorisées et les résultats après intervention.", "example": null}, {"title": "Cheatsheet et routine quotidienne", "body": "<pre><code class=\"language-bash\">hostname; date; uptime\ntop -bn1 | head -n 15\nfree -h\ndf -hT; df -i\nsystemctl --failed\nip -br addr; ss -s\njournalctl -p err --since '24 hours ago' -n 50\njournalctl --disk-usage\ntimedatectl status\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n  <th>Commande<\/th>\n  <th>Usage<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>nproc, mpstat, sar<\/td>\n  <td>CPU et historique<\/td>\n<\/tr>\n<tr>\n  <td>vmstat, free<\/td>\n  <td>Mémoire et swap<\/td>\n<\/tr>\n<tr>\n  <td>df, du, find, lsblk, findmnt<\/td>\n  <td>Stockage<\/td>\n<\/tr>\n<tr>\n  <td>lsof +L1, iostat<\/td>\n  <td>Fichiers ouverts, I/O<\/td>\n<\/tr>\n<tr>\n  <td>ps, systemctl, journalctl<\/td>\n  <td>Processus, services, logs<\/td>\n<\/tr>\n<tr>\n  <td>tail, grep, zgrep<\/td>\n  <td>Analyse des journaux<\/td>\n<\/tr>\n<tr>\n  <td>ip, ss, ping, nc, curl, dig<\/td>\n  <td>Réseau<\/td>\n<\/tr>\n<tr>\n  <td>crontab, timedatectl<\/td>\n  <td>Tâches, temps<\/td>\n<\/tr>\n<tr>\n  <td>getenforce, openssl<\/td>\n  <td>Sécurité<\/td>\n<\/tr>\n<tr>\n  <td>docker stats, gzip, tar<\/td>\n  <td>Conteneurs, archives<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n", "text": "```bash\nhostname; date; uptime\ntop -bn1 | head -n 15\nfree -h\ndf -hT; df -i\nsystemctl --failed\nip -br addr; ss -s\njournalctl -p err --since '24 hours ago' -n 50\njournalctl --disk-usage\ntimedatectl status\n```\n| Commande | Usage |\n|---|---|\n| nproc, mpstat, sar | CPU et historique |\n| vmstat, free | Mémoire et swap |\n| df, du, find, lsblk, findmnt | Stockage |\n| lsof +L1, iostat | Fichiers ouverts, I/O |\n| ps, systemctl, journalctl | Processus, services, logs |\n| tail, grep, zgrep | Analyse des journaux |\n| ip, ss, ping, nc, curl, dig | Réseau |\n| crontab, timedatectl | Tâches, temps |\n| getenforce, openssl | Sécurité |\n| docker stats, gzip, tar | Conteneurs, archives |\n", "id": "chapitre-30", "lead": "Retrouver rapidement les commandes essentielles après avoir compris leur rôle.", "example": null}, {"title": "Références et conclusion", "body": "<pre><code class=\"language-bash\">man top\nman free\nman df\nman du\nman find\nman systemctl\nman journalctl\nman ss\nman lsof\nman iostat\nman logrotate\nman openssl\n<\/code><\/pre>\n<p>Observer → Analyser → Identifier → Faire valider → Corriger → Vérifier → Documenter. Adapter les chemins, services, seuils et règles aux environnements réels. Ce guide pédagogique n’est pas une procédure officielle validée par Yas.<\/p>\n", "text": "```bash\nman top\nman free\nman df\nman du\nman find\nman systemctl\nman journalctl\nman ss\nman lsof\nman iostat\nman logrotate\nman openssl\n```\nObserver → Analyser → Identifier → Faire valider → Corriger → Vérifier → Documenter. Adapter les chemins, services, seuils et règles aux environnements réels. Ce guide pédagogique n’est pas une procédure officielle validée par Yas.\n", "id": "chapitre-31", "lead": "Consulter les manuels locaux et adapter les commandes aux versions installées.", "example": null}, {"id": "quick-start", "title": "Quick Start", "lead": "Un parcours de démarrage pour vérifier les ressources essentielles d’un serveur Linux, comprendre les résultats et savoir quand approfondir.", "text": "routine quotidienne CPU RAM disque réseau services logs sauvegardes démarrage rapide", "body": "<h2>Avant de commencer<\/h2><p>Connecte-toi au serveur autorisé et confirme son nom. Le contrôle initial se fait en lecture seule : aucune suppression, aucun redémarrage.<\/p><h2>Les quatre ressources essentielles<\/h2><div class=\"quickgrid\"><a href=\"#chapitre-4\"><span class=\"tileicon\">CPU<\/span><b>Processeur<\/b><small>Charge et traitements<\/small><\/a><a href=\"#chapitre-5\"><span class=\"tileicon yellow\">RAM<\/span><b>Mémoire<\/b><small>Capacité disponible<\/small><\/a><a href=\"#chapitre-7\"><span class=\"tileicon\">SSD<\/span><b>Stockage<\/b><small>Espace et partitions<\/small><\/a><a href=\"#chapitre-10\"><span class=\"tileicon yellow\">NET<\/span><b>Réseau<\/b><small>Connectivité et ports<\/small><\/a><\/div><h2>Effectuer les premiers contrôles<\/h2><p>Exécute chaque commande séparément, lis son résultat et passe à la suivante.<\/p><section class=\"step\"><h3><span>01<\/span> Identifier le serveur<\/h3><pre><code>hostname<\/code><\/pre><p>Vérifier que le nom correspond à la machine attendue.<\/p><\/section><section class=\"step\"><h3><span>02<\/span> Contrôler la charge<\/h3><pre><code>uptime<\/code><\/pre><p>Comparer les charges moyennes au nombre de CPU logiques.<\/p><\/section><section class=\"step\"><h3><span>03<\/span> Contrôler la mémoire<\/h3><pre><code>free -h<\/code><\/pre><p>Lire la colonne available, puis examiner la swap si nécessaire.<\/p><\/section><section class=\"step\"><h3><span>04<\/span> Contrôler le stockage<\/h3><pre><code>df -hT<\/code><\/pre><p>Repérer les partitions proches du seuil d’alerte.<\/p><\/section><section class=\"step\"><h3><span>05<\/span> Contrôler les services<\/h3><pre><code>systemctl --failed<\/code><\/pre><p>Identifier les unités en échec et contrôler aussi les services attendus.<\/p><\/section><section class=\"step\"><h3><span>06<\/span> Contrôler le réseau<\/h3><pre><code>ss -tulnp<\/code><\/pre><p>Vérifier les ports locaux attendus ; tester les dépendances si nécessaire.<\/p><\/section><section class=\"step\"><h3><span>07<\/span> Contrôler les journaux<\/h3><pre><code>journalctl -p err --since &quot;24 hours ago&quot; -n 50<\/code><\/pre><p>Relever les erreurs pertinentes avec leur horodatage.<\/p><\/section><section class=\"step\"><h3><span>08<\/span> Contrôler les sauvegardes<\/h3><pre><code>ls -lht /backup | head -n 15<\/code><\/pre><p>Adapter le chemin réel et confirmer le succès du job de sauvegarde.<\/p><\/section><h2>Après les contrôles<\/h2><p>Documenter les anomalies et les preuves. En cas de risque, consulter le chapitre correspondant puis faire valider toute correction.<\/p><p><a href=\"#chapitre-27\">Ouvrir la checklist complète →<\/a><\/p>"}];const groups=[[0,'Démarrage'],[3,'Ressources système'],[6,'Stockage'],[9,'Réseau & services'],[12,'Logs & maintenance'],[15,'Cas pratiques'],[21,'Sécurité & exploitation'],[25,'Diagnostics avancés'],[30,'Procédures & références']];const $=id=>document.getElementById(id);const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const link=(i,label)=>`<a href="#${docs[i].id}">${label||esc(docs[i].title)}</a>`;function store(k,v){try{localStorage.setItem(k,v)}catch{}}function read(k){try{return localStorage.getItem(k)}catch{return null}}function nav(){let out='<div class="side-label">Guide serveur</div><a class="nav" href="#quick-start" data-id="quick-start">Quick Start</a>';groups.forEach(([start,title],j)=>{let end=groups[j+1]?.[0]??docs.length-1;out+=`<details class="navgroup" name="yas-navigation"><summary>${esc(title)}</summary><div class="navchildren">${docs.slice(start,end).map(d=>`<a class="nav" href="#${d.id}" data-id="${d.id}">${esc(d.title)}</a>`).join('')}</div></details>`});$('sidebar').innerHTML=out;let panels=[...$('sidebar').querySelectorAll('.navgroup')];panels.forEach(panel=>panel.addEventListener('toggle',()=>{if(panel.open)panels.forEach(other=>{if(other!==panel)other.open=false})}));}nav();function show(){let i=docs.findIndex(d=>d.id===location.hash.slice(1));if(i<0)i=docs.length-1;let d=docs[i];document.querySelectorAll('.nav').forEach(a=>{let active=a.dataset.id===d.id;a.classList.toggle('active',active);if(active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});let activeLink=$('sidebar').querySelector('[aria-current="page"]');let activePanel=activeLink?.closest('.navgroup');$('sidebar').querySelectorAll('.navgroup').forEach(panel=>{panel.classList.toggle('current',panel===activePanel);panel.open=panel===activePanel});$('crumb').textContent='Documentation  /  Server Health Check  /  '+d.title;$('hero').innerHTML=false?`<div class="hero"><div class="eyebrow">Guide opérationnel · IT Support</div><h1>Server Health Check</h1><p>Le guide de référence pour diagnostiquer, maintenir et sécuriser les serveurs Linux.</p><div class="meta"><span>Red Hat Enterprise Linux</span><span>Support N1 / N2</span><span>${docs.length} chapitres</span></div></div><div class="quickgrid">${link(6,'Stockage & partitions<small>Analyser les disques et libérer de l’espace</small>')}${link(11,'Services systemd<small>Diagnostiquer les services en échec</small>')}${link(12,'Logs système<small>Identifier les erreurs et événements</small>')}${link(30,'Checklist quotidienne<small>Effectuer les contrôles de routine</small>')}</div>`:'';$('article').innerHTML=`<div class="eyebrow">Chapitre ${String(i+1).padStart(2,'0')} / ${docs.length}</div><h1>${esc(d.title)}</h1>`+`<p class="lead">${esc(d.lead||'')}</p>`+d.body; if(d.example){let [cmd,out,meaning]=d.example; $('article').querySelector('.lead').insertAdjacentHTML('afterend',`<section class="worked"><h2>Premier contrôle</h2><pre><code>${esc(cmd)}</code></pre><div class="output-label">Exemple de résultat (fictif)</div><div class="sample"><pre>${esc(out)}</pre></div><p><strong>Comment lire le résultat :</strong> ${esc(meaning)}</p></section>`)} if(i===13||d.practice)$('article').insertAdjacentHTML('afterbegin','<div class="notice">Production : les opérations de suppression ou de rotation doivent être validées avant exécution.</div>');if(d.practice){initRegex();}else if(i!==docs.length-1) organize();document.querySelectorAll('pre:not(.sample pre)').forEach(pre=>{let w=document.createElement('div');w.className='codewrap';pre.before(w);w.innerHTML='<div class="codebar"><span>TERMINAL / BASH</span><button class="copy">Copier</button></div>';w.append(pre);w.querySelector('button').onclick=async e=>{try{await navigator.clipboard.writeText(pre.innerText)}catch{let t=document.createElement('textarea');t.value=pre.innerText;document.body.append(t);t.select();document.execCommand('copy');t.remove()}e.target.textContent='Copié ✓';setTimeout(()=>e.target.textContent='Copier',1500)}});document.querySelectorAll('article table').forEach(t=>{let w=document.createElement('div');w.className='tablewrap';t.before(w);w.append(t)});if(d.title==='Fréquence et checklist')checklist();if(d.title==='Tendances et anticipation')calc();if(d.title==='CPU et Load Average')loadcalc();let toc=i===docs.length-1?'<div class="summary"><strong>Contrôle rapide</strong><p>Identifier, mesurer, interpréter et documenter. Aucune correction sans validation.</p></div><div class="rightcheck"><strong>Checklist du jour</strong>'+['Serveur identifié','CPU et RAM contrôlés','Disques et inodes contrôlés','Réseau et services contrôlés','Logs et sauvegardes vérifiés'].map((v,j)=>`<label><input type="checkbox" data-q="${j}">${v}</label>`).join('')+'</div>':'<strong>Sur cette page</strong>';document.querySelectorAll('article h2').forEach((h,j)=>{h.id='sub-'+j;toc+=`<a href="#${d.id}" data-sub="${h.id}">${esc(h.textContent)}</a>`});toc+='<a href="#'+d.id+'" data-sub="top">↑ Retour en haut</a><hr style="border:0;border-top:1px solid var(--line)"><a href="#chapitre-1">← Accueil</a><a href="#" id="print">Imprimer le chapitre</a>';$('toc').innerHTML=toc;$('toc').querySelectorAll('[data-q]').forEach(b=>{let k='yas-quick-'+b.dataset.q;b.checked=read(k)==='1';b.onchange=()=>store(k,b.checked?'1':'0')});$('toc').querySelectorAll('[data-sub]').forEach(a=>a.onclick=e=>{e.preventDefault();a.dataset.sub==='top'?window.scrollTo({top:0,behavior:'smooth'}):document.getElementById(a.dataset.sub).scrollIntoView({behavior:'smooth',block:'center'})});$('print').onclick=e=>{e.preventDefault();window.print()};$('pager').innerHTML=i===docs.length-1?link(0,'<small>Commencer la lecture →</small>Introduction'):(i?link(i-1,'<small>← Précédent</small>'+esc(docs[i-1].title)):'<span></span>')+(i<docs.length-1?link(i+1,'<small>Suivant →</small>'+esc(docs[i+1].title)):'');$('sidebar').classList.remove('open');window.scrollTo(0,0)}

function initRegex(){let r=$('rx'),n=$('rxnames'),o=$('rxout');if(!r)return;function update(){try{let re=new RegExp(r.value);o.replaceChildren();let count=0;for(let name of n.value.split('\n').filter(Boolean)){let ok=re.test(name);if(ok)count++;let row=document.createElement('p');row.textContent=(ok?'✓ Retenu : ':'– Exclu : ')+name;row.style.color=ok?'#17613d':'#657386';o.append(row)}let p=document.createElement('strong');p.textContent=count+' fichier(s) retenu(s)';o.append(p)}catch{ o.textContent='Expression régulière invalide'; }}r.oninput=n.oninput=update;update()}
function purpose(c){
 const rules=[[/^ssh /,'Ouvrir une session distante autorisée.'],[/^whoami/,'Identifier le compte de la session.'],[/^id$/,'Afficher UID, GID et groupes.'],[/^hostnamectl/,'Consulter les informations détaillées de la machine.'],[/^hostname/,'Confirmer le nom du serveur.'],[/^cat \/etc\/(os-release|redhat-release)/,'Identifier la distribution et sa version.'],[/^uname/,'Identifier le noyau ou l’architecture.'],[/^date/,'Vérifier la date et l’heure.'],[/^uptime/,'Lire la durée de fonctionnement et la charge moyenne.'],[/^who -b/,'Identifier le dernier démarrage.'],[/^last/,'Consulter l’historique des connexions ou redémarrages.'],[/^lscpu|^nproc/,'Identifier les capacités CPU logiques.'],[/^top -H/,'Examiner les threads du processus ciblé.'],[/^top/,'Observer la consommation CPU et les processus.'],[/^ps .*%cpu|^ps .*--sort=-%cpu/,'Identifier les processus consommateurs de CPU.'],[/^ps .*rss|^ps .*--sort=-%mem/,'Identifier les processus consommateurs de mémoire.'],[/^ps /,'Examiner les processus, leurs états ou leurs ressources.'],[/^mpstat/,'Mesurer l’activité de chaque CPU sur plusieurs intervalles.'],[/^sar/,'Consulter les métriques système collectées par sysstat.'],[/^free/,'Lire la RAM disponible et la swap utilisée.'],[/^cat \/proc\/meminfo/,'Consulter les compteurs détaillés de mémoire.'],[/^vmstat/,'Observer les échanges swap, tâches bloquées et activité système.'],[/^swapon/,'Lister les espaces swap actifs.'],[/^sysctl/,'Consulter le paramètre noyau indiqué.'],[/^df -i/,'Contrôler les inodes disponibles.'],[/^df/,'Mesurer l’occupation et l’espace disponible du filesystem.'],[/^lsblk/,'Identifier les périphériques, partitions et volumes.'],[/^findmnt/,'Identifier les points de montage.'],[/^cat \/etc\/fstab/,'Lire la configuration des montages persistants.'],[/^du --inodes/,'Identifier les répertoires consommateurs d’inodes.'],[/^du/,'Mesurer la taille des répertoires et localiser les consommateurs.'],[/^find .* -ok|^find .* -delete|^rm /,'Action destructive : function organize(){let art=$('article');let blocks=[...art.querySelectorAll('pre')].filter(x=>!x.closest('.worked'));blocks.forEach((pre,k)=>{let code=pre.textContent.trim();if(code.startsWith('#!/bin/bash')||code.includes('\n    ')||code.includes('\\\n')||code.includes('{\n')){let d=document.createElement('details');d.className='advanced';d.innerHTML='<summary>Afficher le script ou bloc complet</summary><p>Lire et vérifier toutes les lignes avant exécution. Les actions de modification sont soumises à validation.</p>';pre.before(d);d.append(pre);return}let lines=code.split('\n').filter(Boolean);let section=document.createElement('section');section.className='commandgroup';let title=document.createElement('h2');title.textContent=k===0?'Commandes de diagnostic':'Commandes complémentaires';section.append(title);let rest=document.createElement('details');rest.className='advanced';rest.innerHTML='<summary>Afficher les commandes complémentaires</summary>';let count=0;lines.forEach(c=>{let row=document.createElement('div');row.className='cmditem';if(c.startsWith('#')){row.innerHTML='<p>'+esc(c.slice(1).trim())+'</p>';rest.append(row);return;}let destructive=/\b(rm|truncate|delete|vacuum|rotate|gzip|gunzip|zip|tar|chmod)\b/.test(c);row.innerHTML='<p class="cmdpurpose">'+esc(purpose(c))+'</p><pre><code>'+esc(c)+'</code></pre>';if(count<2&&!destructive){section.append(row);count++}else rest.append(row)});if(rest.children.length>1)section.append(rest);pre.replaceWith(section)});}

function checklist(){let items=['Identification du serveur','Uptime et horloge','CPU et load average','RAM et swap','Partitions et inodes','Montages critiques','Services attendus','Interfaces et ports','Logs et OOM','Sauvegardes et tâches','Anomalies et preuves','Actions validées et rapport'];let saved=JSON.parse(read('yas-checks')||'[]');let div=document.createElement('div');div.className='tools checklist';div.innerHTML='<h2>Checklist interactive</h2><p id="progress"></p>'+items.map((v,i)=>`<label><input type="checkbox" ${saved.includes(i)?'checked':''}>${v}</label>`).join('')+'<button class="iconbtn" id="reset">Réinitialiser</button>';$('article').append(div);let boxes=[...div.querySelectorAll('input')];function update(){let checked=boxes.flatMap((b,i)=>b.checked?[i]:[]);store('yas-checks',JSON.stringify(checked));$('progress').textContent=checked.length+' / '+items.length+' contrôles réalisés'}boxes.forEach(b=>b.onchange=update);$('reset').onclick=()=>{boxes.forEach(b=>b.checked=false);update()};update()}
function tool(title,fields,fn){let div=document.createElement('div');div.className='tools';div.innerHTML='<h2>'+title+'</h2><div class="toolgrid">'+fields.map(([n,v])=>`<label>${n}<input type="number" min="0" step="any" value="${v}"></label>`).join('')+'</div><div class="out"></div>';$('article').append(div);let inputs=[...div.querySelectorAll('input')];function update(){div.querySelector('.out').textContent=fn(inputs.map(x=>Number(x.value)))}inputs.forEach(x=>x.oninput=update);update()}function calc(){tool('Calculateur de saturation',[['Capacité (Go)',500],['Utilisé (Go)',435],['Croissance (Go/j)',10],['Seuil (%)',90]],([c,u,g,t])=>c>0&&g>0&&u>=0&&u<=c&&t>0&&t<=100?Math.max(0,(c*t/100-u)/g).toFixed(1)+' jour(s) avant seuil':'Valeurs invalides')}function loadcalc(){tool('Analyseur de charge',[['CPU logiques',8],['Load average',2.5]],([c,l])=>c>0&&l>=0?(100*l/c).toFixed(1)+' % de charge relative':'Valeurs invalides')}
function search(){let q=$('search').value.trim().toLowerCase();$('results').classList.toggle('hidden',!q);if(!q)return;let matches=docs.map((d,i)=>({d,i,score:(d.title.toLowerCase().includes(q)?10:0)+(d.text.toLowerCase().includes(q)?1:0)})).filter(x=>x.score).sort((a,b)=>b.score-a.score);$('results').innerHTML=matches.length?matches.map(({d,i})=>link(i,esc(d.title)+'<small>Chapitre '+(i+1)+'</small>')).join(''):'<div style="padding:14px">Aucun résultat</div>';$('results').querySelectorAll('a').forEach(a=>a.onclick=()=>{$('search').value='';$('results').classList.add('hidden')})}$('search').oninput=search;$('search').onkeydown=e=>{if(e.key==='Escape')$('results').classList.add('hidden');if(e.key==='Enter')$('results').querySelector('a')?.click()};document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('results').classList.add('hidden')});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();$('search').focus()}});$('menu').onclick=()=>$('sidebar').classList.toggle('open');window.addEventListener('hashchange',show);show();</script></body></html>
