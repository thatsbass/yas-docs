const docs=[{"title": "Introduction", "body": "<p>Le Health Check serveur est un ensemble de contrôles préventifs visant à garantir la disponibilité, la stabilité et les performances d’un serveur Linux. Ce guide est orienté Red Hat Enterprise Linux (RHEL), Support Applicatif N1/N2, et couvre les serveurs SQL Server, Talend ESB, WSO2, Grafana et Jenkins. Il exclut les tests métier et la supervision F5/SolarWinds.<\/p>\n<h2>Objectifs<\/h2>\n<p>Détecter les saturations, contrôler les services, anticiper les incidents, vérifier les sauvegardes et documenter les interventions. Les seuils sont indicatifs, non des procédures officielles Yas.<\/p>\n", "text": "Le Health Check serveur est un ensemble de contrôles préventifs visant à garantir la disponibilité, la stabilité et les performances d’un serveur Linux. Ce guide est orienté Red Hat Enterprise Linux (RHEL), Support Applicatif N1/N2, et couvre les serveurs SQL Server, Talend ESB, WSO2, Grafana et Jenkins. Il exclut les tests métier et la supervision F5/SolarWinds.\n## Objectifs\nDétecter les saturations, contrôler les services, anticiper les incidents, vérifier les sauvegardes et documenter les interventions. Les seuils sont indicatifs, non des procédures officielles Yas.\n", "id": "chapitre-1", "lead": "Comprendre le rôle du contrôle préventif avant de se connecter à un serveur.", "example": null}, {"title": "Architecture et précautions", "body": "<table>\n<thead>\n<tr>\n  <th>Couche<\/th>\n  <th>Contrôles<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Système<\/td>\n  <td>OS, kernel, uptime, horloge<\/td>\n<\/tr>\n<tr>\n  <td>Ressources<\/td>\n  <td>CPU, RAM, swap<\/td>\n<\/tr>\n<tr>\n  <td>Stockage<\/td>\n  <td>Partitions, inodes, I/O<\/td>\n<\/tr>\n<tr>\n  <td>Réseau<\/td>\n  <td>Interfaces, routage, DNS, ports<\/td>\n<\/tr>\n<tr>\n  <td>Exploitation<\/td>\n  <td>Processus, services, logs, backups<\/td>\n<\/tr>\n<tr>\n  <td>Sécurité<\/td>\n  <td>Accès, SELinux, TLS<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Règles de production<\/h2>\n<ul>\n<li>Commencer en lecture seule et identifier l’environnement.<\/li>\n<li>Ne jamais redémarrer, supprimer ou modifier sans validation.<\/li>\n<li>Vérifier les politiques de rétention, les dépendances et les preuves avant intervention.<\/li>\n<li>Ne jamais supprimer les fichiers actifs d’une base de données.<\/li>\n<li>Comparer les mesures avant et après, documenter et escalader selon l’impact.<\/li>\n<\/ul>\n", "text": "| Couche | Contrôles |\n|---|---|\n| Système | OS, kernel, uptime, horloge |\n| Ressources | CPU, RAM, swap |\n| Stockage | Partitions, inodes, I/O |\n| Réseau | Interfaces, routage, DNS, ports |\n| Exploitation | Processus, services, logs, backups |\n| Sécurité | Accès, SELinux, TLS |\n## Règles de production\n- Commencer en lecture seule et identifier l’environnement.\n- Ne jamais redémarrer, supprimer ou modifier sans validation.\n- Vérifier les politiques de rétention, les dépendances et les preuves avant intervention.\n- Ne jamais supprimer les fichiers actifs d’une base de données.\n- Comparer les mesures avant et après, documenter et escalader selon l’impact.\n", "id": "chapitre-2", "lead": "Avant de diagnostiquer, identifier le périmètre et distinguer observation et correction.", "example": null}, {"title": "Identification du serveur", "body": "<pre><code class=\"language-bash\">ssh utilisateur@adresse_ip\nwhoami\nid\nhostname\nhostnamectl\ncat /etc/os-release\ncat /etc/redhat-release\nuname -r\nuname -a\ndate\ntimedatectl\nuptime\nwho -b\nlast -x reboot | head\n<\/code><\/pre>\n<p><code>uptime<\/code> indique le temps de fonctionnement, les sessions et les charges moyennes à 1, 5 et 15 minutes. Un redémarrage inattendu est à investiguer. Une horloge incorrecte affecte les certificats, transactions et corrélations de logs.<\/p>\n", "text": "```bash\nssh utilisateur@adresse_ip\nwhoami\nid\nhostname\nhostnamectl\ncat /etc/os-release\ncat /etc/redhat-release\nuname -r\nuname -a\ndate\ntimedatectl\nuptime\nwho -b\nlast -x reboot | head\n```\n`uptime` indique le temps de fonctionnement, les sessions et les charges moyennes à 1, 5 et 15 minutes. Un redémarrage inattendu est à investiguer. Une horloge incorrecte affecte les certificats, transactions et corrélations de logs.\n", "id": "chapitre-3", "lead": "Commencer par confirmer la machine, son environnement et son dernier démarrage.", "example": ["hostname", "SRV-APP-PROD", "Confirmer le nom avec l’inventaire. Si la machine n’est pas celle attendue, arrêter l’intervention."]}, {"title": "CPU et Load Average", "body": "<pre><code class=\"language-bash\">lscpu\nnproc\ntop\nps -eo pid,ppid,user,comm,%cpu,%mem --sort=-%cpu | head -n 15\nmpstat -P ALL 1 5\nsar -u 1 5\nsar -u\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n  <th>Champ top<\/th>\n  <th>Signification<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>us<\/td>\n  <td>CPU utilisateur<\/td>\n<\/tr>\n<tr>\n  <td>sy<\/td>\n  <td>CPU noyau<\/td>\n<\/tr>\n<tr>\n  <td>ni<\/td>\n  <td>Priorité ajustée<\/td>\n<\/tr>\n<tr>\n  <td>id<\/td>\n  <td>CPU inactif<\/td>\n<\/tr>\n<tr>\n  <td>wa<\/td>\n  <td>Attente I/O<\/td>\n<\/tr>\n<tr>\n  <td>hi / si<\/td>\n  <td>Interruptions matérielles / logicielles<\/td>\n<\/tr>\n<tr>\n  <td>st<\/td>\n  <td>Temps retenu par hyperviseur<\/td>\n<\/tr>\n<tr>\n  <td>CPU soutenu<\/td>\n  <td>Statut<\/td>\n<\/tr>\n<tr>\n  <td>&lt;70%<\/td>\n  <td>Normal<\/td>\n<\/tr>\n<tr>\n  <td>70–85%<\/td>\n  <td>Warning<\/td>\n<\/tr>\n<tr>\n  <td>85–95%<\/td>\n  <td>Élevé<\/td>\n<\/tr>\n<tr>\n  <td>&gt;95%<\/td>\n  <td>Critique<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Le load average compte les tâches exécutables et en attente non interruptible. Comparer au nombre de CPU logiques, sans assimiler ce rapport à un pourcentage CPU. Un pic isolé ne suffit pas. <code>sysstat<\/code> est nécessaire pour sar/mpstat ; historique si collecte activée.<\/p>\n<h2>Cas Talend : CPU à 95 %<\/h2>\n<pre><code class=\"language-bash\">uptime\nnproc\ntop\nps -eo pid,user,comm,%cpu --sort=-%cpu | head\ntop -H -p 2456\n<\/code><\/pre>\n<p>Identifier le job et ses threads, consulter les logs, escalader. Ne pas tuer Java directement.<\/p>\n", "text": "```bash\nlscpu\nnproc\ntop\nps -eo pid,ppid,user,comm,%cpu,%mem --sort=-%cpu | head -n 15\nmpstat -P ALL 1 5\nsar -u 1 5\nsar -u\n```\n| Champ top | Signification |\n|---|---|\n| us | CPU utilisateur |\n| sy | CPU noyau |\n| ni | Priorité ajustée |\n| id | CPU inactif |\n| wa | Attente I/O |\n| hi / si | Interruptions matérielles / logicielles |\n| st | Temps retenu par hyperviseur |\n| CPU soutenu | Statut |\n| <70% | Normal |\n| 70–85% | Warning |\n| 85–95% | Élevé |\n| >95% | Critique |\nLe load average compte les tâches exécutables et en attente non interruptible. Comparer au nombre de CPU logiques, sans assimiler ce rapport à un pourcentage CPU. Un pic isolé ne suffit pas. `sysstat` est nécessaire pour sar/mpstat ; historique si collecte activée.\n## Cas Talend : CPU à 95 %\n```bash\nuptime\nnproc\ntop\nps -eo pid,user,comm,%cpu --sort=-%cpu | head\ntop -H -p 2456\n```\nIdentifier le job et ses threads, consulter les logs, escalader. Ne pas tuer Java directement.\n", "id": "chapitre-4", "lead": "Le CPU exécute les traitements. Une charge durablement élevée mérite une analyse des processus et des entrées-sorties.", "example": ["top", "%Cpu(s): 12.0 us, 5.0 sy, 80.0 id, 2.0 wa, 1.0 st", "80 % de temps inactif indique une marge CPU à cet instant. Observer sur plusieurs mesures ; un wa élevé oriente vers les I/O."]}, {"title": "Mémoire RAM", "body": "<pre><code class=\"language-bash\">free -h\nps aux --sort=-%mem | head -n 15\nps -eo pid,user,comm,rss,%mem --sort=-rss | head -n 15\ncat /proc/meminfo\nsar -r\njournalctl -k --since '24 hours ago' | grep -Ei 'out of memory|oom-kill|killed process'\ndmesg -T | grep -Ei 'oom|out of memory|killed process'\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n  <th>Champ<\/th>\n  <th>Signification<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>total<\/td>\n  <td>Mémoire physique<\/td>\n<\/tr>\n<tr>\n  <td>used<\/td>\n  <td>Mémoire utilisée selon la version de free<\/td>\n<\/tr>\n<tr>\n  <td>free<\/td>\n  <td>Mémoire inutilisée<\/td>\n<\/tr>\n<tr>\n  <td>shared<\/td>\n  <td>Mémoire partagée<\/td>\n<\/tr>\n<tr>\n  <td>buff/cache<\/td>\n  <td>Buffers et caches<\/td>\n<\/tr>\n<tr>\n  <td>available<\/td>\n  <td>Estimation de mémoire disponible sans swap important<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Prioriser <code>available<\/code> plutôt que <code>free<\/code>. RSS est généralement en Kio. Seuils RAM disponible : &gt;30 % normal, 15–30 % surveillance, 5–15 % élevé, &lt;5 % critique, à corréler avec la pression mémoire.<\/p>\n<h2>Cas WSO2<\/h2>\n<p>16 Go de RAM, 250 Mo disponibles, swap 3,8/4 Go : vérifier free, vmstat, processus et événements OOM. Causes possibles : fuite Java, trafic ou JVM mal dimensionnée. Escalader avant modification.<\/p>\n", "text": "```bash\nfree -h\nps aux --sort=-%mem | head -n 15\nps -eo pid,user,comm,rss,%mem --sort=-rss | head -n 15\ncat /proc/meminfo\nsar -r\njournalctl -k --since '24 hours ago' | grep -Ei 'out of memory|oom-kill|killed process'\ndmesg -T | grep -Ei 'oom|out of memory|killed process'\n```\n| Champ | Signification |\n|---|---|\n| total | Mémoire physique |\n| used | Mémoire utilisée selon la version de free |\n| free | Mémoire inutilisée |\n| shared | Mémoire partagée |\n| buff/cache | Buffers et caches |\n| available | Estimation de mémoire disponible sans swap important |\nPrioriser `available` plutôt que `free`. RSS est généralement en Kio. Seuils RAM disponible : >30 % normal, 15–30 % surveillance, 5–15 % élevé, <5 % critique, à corréler avec la pression mémoire.\n## Cas WSO2\n16 Go de RAM, 250 Mo disponibles, swap 3,8/4 Go : vérifier free, vmstat, processus et événements OOM. Causes possibles : fuite Java, trafic ou JVM mal dimensionnée. Escalader avant modification.\n", "id": "chapitre-5", "lead": "La RAM contient les données des processus en cours. Une mémoire libre faible n’est pas forcément une anomalie : regarder surtout la mémoire disponible.", "example": ["free -h", "              total  used  free  buff/cache  available\nMem:           16Gi   10Gi   1Gi        5Gi        5Gi\nSwap:           4Gi    0Gi   4Gi", "La colonne available indique ici environ 5 Gio disponibles. Ne pas confondre free et available."]}, {"title": "Swap", "body": "<pre><code class=\"language-bash\">free -h\nswapon --show\nvmstat 1 5\nsysctl vm.swappiness\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n  <th>Champ vmstat<\/th>\n  <th>Description<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>r<\/td>\n  <td>Tâches exécutables<\/td>\n<\/tr>\n<tr>\n  <td>b<\/td>\n  <td>Tâches bloquées<\/td>\n<\/tr>\n<tr>\n  <td>swpd<\/td>\n  <td>Swap utilisée<\/td>\n<\/tr>\n<tr>\n  <td>si / so<\/td>\n  <td>Entrées / sorties swap<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Une swap occupée sans échanges soutenus n’est pas nécessairement un incident. Ne pas lancer swapoff ni modifier swappiness sans validation.<\/p>\n", "text": "```bash\nfree -h\nswapon --show\nvmstat 1 5\nsysctl vm.swappiness\n```\n| Champ vmstat | Description |\n|---|---|\n| r | Tâches exécutables |\n| b | Tâches bloquées |\n| swpd | Swap utilisée |\n| si / so | Entrées / sorties swap |\nUne swap occupée sans échanges soutenus n’est pas nécessairement un incident. Ne pas lancer swapoff ni modifier swappiness sans validation.\n", "id": "chapitre-6", "lead": "La swap est un espace disque utilisé comme extension de la mémoire. Examiner les échanges plutôt que sa seule occupation.", "example": ["vmstat 1 5", "r  b  swpd  free  buff  cache  si  so\n1  0  1024  2048   512   4096   0   0", "si et so à zéro sur plusieurs mesures : pas d’échanges swap actifs pendant cet intervalle."]}, {"title": "Stockage et partitions", "body": "<pre><code class=\"language-bash\">df -h\ndf -hT\nlsblk\nlsblk -f\nfindmnt\nfindmnt -T /var/opt/mssql\ncat /etc/fstab\ndu -xhd1 /var | sort -hr\ndu -xhd1 /var/opt/mssql | sort -hr\nfind /var -xdev -type f -size +1G -exec ls -lh {} \\;\nfind /var -xdev -type f -printf '%s\\t%p\\n' | sort -nr | head -n 20 | numfmt --field=1 --to=iec\nfind /opt -type f -name 'mesure.sh'\nlsof +L1\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n  <th>Utilisation<\/th>\n  <th>Statut<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>&lt;70%<\/td>\n  <td>Normal<\/td>\n<\/tr>\n<tr>\n  <td>70–79%<\/td>\n  <td>Warning<\/td>\n<\/tr>\n<tr>\n  <td>80–89%<\/td>\n  <td>Élevé<\/td>\n<\/tr>\n<tr>\n  <td>90–94%<\/td>\n  <td>Critique<\/td>\n<\/tr>\n<tr>\n  <td>≥95%<\/td>\n  <td>Urgent<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><code>df<\/code> mesure le filesystem, <code>du<\/code> les fichiers accessibles, <code>lsblk<\/code> les périphériques. <code>du -xhd1<\/code> reste sur un filesystem, affiche en unités lisibles et limite la profondeur. Les scans globaux peuvent être coûteux. Un fichier supprimé mais ouvert reste occupé jusqu’à fermeture du descripteur. Vérifier lsof avant tout redémarrage. Les blocs réservés, métadonnées et montages masqués expliquent aussi des écarts df/du.<\/p>\n", "text": "```bash\ndf -h\ndf -hT\nlsblk\nlsblk -f\nfindmnt\nfindmnt -T /var/opt/mssql\ncat /etc/fstab\ndu -xhd1 /var | sort -hr\ndu -xhd1 /var/opt/mssql | sort -hr\nfind /var -xdev -type f -size +1G -exec ls -lh {} \\;\nfind /var -xdev -type f -printf '%s\\t%p\\n' | sort -nr | head -n 20 | numfmt --field=1 --to=iec\nfind /opt -type f -name 'mesure.sh'\nlsof +L1\n```\n| Utilisation | Statut |\n|---|---|\n| <70% | Normal |\n| 70–79% | Warning |\n| 80–89% | Élevé |\n| 90–94% | Critique |\n| ≥95% | Urgent |\n`df` mesure le filesystem, `du` les fichiers accessibles, `lsblk` les périphériques. `du -xhd1` reste sur un filesystem, affiche en unités lisibles et limite la profondeur. Les scans globaux peuvent être coûteux. Un fichier supprimé mais ouvert reste occupé jusqu’à fermeture du descripteur. Vérifier lsof avant tout redémarrage. Les blocs réservés, métadonnées et montages masqués expliquent aussi des écarts df/du.\n", "id": "chapitre-7", "lead": "Un filesystem plein peut empêcher l’écriture des logs ou des données. Identifier d’abord le point de montage, puis descendre dans les répertoires.", "example": ["df -h", "Filesystem      Size  Used Avail Use% Mounted on\n/dev/sda2        50G   20G   30G  40% /\n/dev/sdb1       500G  475G   25G  95% /var", "/var est à 95 %. Identifier les fichiers consommateurs avec du avant toute suppression."]}, {"title": "Inodes", "body": "<pre><code class=\"language-bash\">df -i\ndu --inodes -x -d1 /var | sort -nr\nfind /var/log -xdev -type f | wc -l\n<\/code><\/pre>\n<p>Un inode stocke les métadonnées d’un fichier. Un épuisement empêche la création de fichiers même si des Go restent disponibles. Rechercher caches, sessions, petits logs et fichiers temporaires.<\/p>\n", "text": "```bash\ndf -i\ndu --inodes -x -d1 /var | sort -nr\nfind /var/log -xdev -type f | wc -l\n```\nUn inode stocke les métadonnées d’un fichier. Un épuisement empêche la création de fichiers même si des Go restent disponibles. Rechercher caches, sessions, petits logs et fichiers temporaires.\n", "id": "chapitre-8", "lead": "Les inodes représentent les métadonnées des fichiers. Leur épuisement peut empêcher toute nouvelle création de fichier.", "example": ["df -i", "Filesystem  Inodes  IUsed  IFree IUse% Mounted on\n/dev/sda2  1000000 980000  20000   98% /", "98 % des inodes utilisés : risque de ne plus pouvoir créer de fichiers, même avec des Go libres."]}, {"title": "Performances disque et LVM", "body": "<pre><code class=\"language-bash\">iostat -xz 1 5\npidstat -d 1 5\niotop -o\njournalctl -k --since today | grep -Ei 'I/O error|buffer I/O|filesystem error|XFS|EXT4'\npvs\nvgs\nlvs\nlvs -a -o lv_name,vg_name,lv_size,data_percent,metadata_percent\nsmartctl -H /dev/sda\nsmartctl -a /dev/sda\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n  <th>I/O<\/th>\n  <th>Signification<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>r/s, w/s<\/td>\n  <td>Opérations par seconde<\/td>\n<\/tr>\n<tr>\n  <td>rkB/s, wkB/s<\/td>\n  <td>Débits<\/td>\n<\/tr>\n<tr>\n  <td>await<\/td>\n  <td>Latence moyenne<\/td>\n<\/tr>\n<tr>\n  <td>aqu-sz<\/td>\n  <td>File d’attente moyenne<\/td>\n<\/tr>\n<tr>\n  <td>%util<\/td>\n  <td>Temps de traitement I/O<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Latence et file croissantes peuvent indiquer saturation. %util seul est insuffisant pour SSD modernes. SMART dépend du matériel et peut être inaccessible en VM/SAN. Vérifier les pools LVM thin et leurs métadonnées. Ne pas lancer fsck/xfs_repair sur un filesystem monté en écriture.<\/p>\n", "text": "```bash\niostat -xz 1 5\npidstat -d 1 5\niotop -o\njournalctl -k --since today | grep -Ei 'I/O error|buffer I/O|filesystem error|XFS|EXT4'\npvs\nvgs\nlvs\nlvs -a -o lv_name,vg_name,lv_size,data_percent,metadata_percent\nsmartctl -H /dev/sda\nsmartctl -a /dev/sda\n```\n| I/O | Signification |\n|---|---|\n| r/s, w/s | Opérations par seconde |\n| rkB/s, wkB/s | Débits |\n| await | Latence moyenne |\n| aqu-sz | File d’attente moyenne |\n| %util | Temps de traitement I/O |\nLatence et file croissantes peuvent indiquer saturation. %util seul est insuffisant pour SSD modernes. SMART dépend du matériel et peut être inaccessible en VM/SAN. Vérifier les pools LVM thin et leurs métadonnées. Ne pas lancer fsck/xfs_repair sur un filesystem monté en écriture.\n", "id": "chapitre-9", "lead": "Un disque peut être lent sans être plein. Mesurer les délais et les files d’attente avant de conclure.", "example": ["iostat -xz 1 5", "Device  r/s  w/s  await  aqu-sz  %util\nsda       20   30   2.5    0.13     12", "Comparer await et aqu-sz à la normale du serveur. Le chiffre %util seul ne suffit pas."]}, {"title": "Réseau et connectivité", "body": "<pre><code class=\"language-bash\">ip addr\nip -4 addr\nip -br addr\nip link show\nip route\nip route get 192.168.1.100\nping -c 4 192.168.1.100\ncat /etc/resolv.conf\ngetent hosts serveur.example.com\nnslookup serveur.example.com\ndig serveur.example.com\nss -tulnp\nss -lntp '( sport = :443 )'\nnc -vz -w 5 192.168.1.100 443\ncurl -I --connect-timeout 5 --max-time 15 https://serveur.example.com\ncurl -sS -o /dev/null --connect-timeout 5 --max-time 15 -w 'HTTP: %{http_code}\\nDNS: %{time_namelookup}s\\nTCP: %{time_connect}s\\nTLS: %{time_appconnect}s\\nTTFB: %{time_starttransfer}s\\nTotal: %{time_total}s\\n' https://serveur.example.com\nss -s\nss -tan state established\nss -tanH | awk '{print $1}' | sort | uniq -c | sort -nr\nip -s link\nethtool eth0\nethtool -S eth0\nsar -n DEV 1 5\nsystemctl status firewalld\nfirewall-cmd --get-active-zones\nfirewall-cmd --list-all-zones\nnft list ruleset\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n  <th>Résultat<\/th>\n  <th>Interprétation<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Connected<\/td>\n  <td>TCP accessible, pas forcément application saine<\/td>\n<\/tr>\n<tr>\n  <td>Refused<\/td>\n  <td>Connexion rejetée<\/td>\n<\/tr>\n<tr>\n  <td>Timed out<\/td>\n  <td>Absence de réponse dans le délai<\/td>\n<\/tr>\n<tr>\n  <td>No route to host<\/td>\n  <td>Routage ou rejet réseau<\/td>\n<\/tr>\n<tr>\n  <td>LISTEN<\/td>\n  <td>Port en écoute<\/td>\n<\/tr>\n<tr>\n  <td>ESTAB<\/td>\n  <td>Connexion établie<\/td>\n<\/tr>\n<tr>\n  <td>TIME-WAIT<\/td>\n  <td>Connexion récemment fermée<\/td>\n<\/tr>\n<tr>\n  <td>CLOSE-WAIT<\/td>\n  <td>Fermeture distante reçue, fermeture locale attendue<\/td>\n<\/tr>\n<tr>\n  <td>SYN-SENT<\/td>\n  <td>Tentative de connexion<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>ICMP peut être filtré. Vérifier erreurs et drops sur interfaces. Ne jamais désactiver le firewall pour contourner un incident. dig/nslookup nécessitent généralement bind-utils.<\/p>\n", "text": "```bash\nip addr\nip -4 addr\nip -br addr\nip link show\nip route\nip route get 192.168.1.100\nping -c 4 192.168.1.100\ncat /etc/resolv.conf\ngetent hosts serveur.example.com\nnslookup serveur.example.com\ndig serveur.example.com\nss -tulnp\nss -lntp '( sport = :443 )'\nnc -vz -w 5 192.168.1.100 443\ncurl -I --connect-timeout 5 --max-time 15 https://serveur.example.com\ncurl -sS -o /dev/null --connect-timeout 5 --max-time 15 -w 'HTTP: %{http_code}\\nDNS: %{time_namelookup}s\\nTCP: %{time_connect}s\\nTLS: %{time_appconnect}s\\nTTFB: %{time_starttransfer}s\\nTotal: %{time_total}s\\n' https://serveur.example.com\nss -s\nss -tan state established\nss -tanH | awk '{print $1}' | sort | uniq -c | sort -nr\nip -s link\nethtool eth0\nethtool -S eth0\nsar -n DEV 1 5\nsystemctl status firewalld\nfirewall-cmd --get-active-zones\nfirewall-cmd --list-all-zones\nnft list ruleset\n```\n| Résultat | Interprétation |\n|---|---|\n| Connected | TCP accessible, pas forcément application saine |\n| Refused | Connexion rejetée |\n| Timed out | Absence de réponse dans le délai |\n| No route to host | Routage ou rejet réseau |\n| LISTEN | Port en écoute |\n| ESTAB | Connexion établie |\n| TIME-WAIT | Connexion récemment fermée |\n| CLOSE-WAIT | Fermeture distante reçue, fermeture locale attendue |\n| SYN-SENT | Tentative de connexion |\nICMP peut être filtré. Vérifier erreurs et drops sur interfaces. Ne jamais désactiver le firewall pour contourner un incident. dig/nslookup nécessitent généralement bind-utils.\n", "id": "chapitre-10", "lead": "Vérifier successivement les interfaces, le routage, la résolution DNS et la connexion au port attendu.", "example": ["ss -tulnp", "tcp LISTEN 0 128 0.0.0.0:443 0.0.0.0:*", "Le port 443 écoute sur toutes les interfaces IPv4. Cela ne prouve pas que le port est accessible depuis un autre serveur."]}, {"title": "Processus et descripteurs", "body": "<pre><code class=\"language-bash\">ps aux\npgrep -af java\npgrep -af sqlservr\nps -p 2456 -o pid,ppid,user,stat,etime,%cpu,%mem,cmd\npstree -p\nps -eo pid,ppid,stat,comm | awk '$3 ~ /^Z/'\nps -eo pid,ppid,stat,wchan:32,comm | awk '$3 ~ /^D/'\ncat /proc/2456/limits\nls -1 /proc/2456/fd | wc -l\ncat /proc/sys/fs/file-nr\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n  <th>État<\/th>\n  <th>Description<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>R<\/td>\n  <td>Exécutable<\/td>\n<\/tr>\n<tr>\n  <td>S<\/td>\n  <td>Attente interruptible<\/td>\n<\/tr>\n<tr>\n  <td>D<\/td>\n  <td>Attente non interruptible<\/td>\n<\/tr>\n<tr>\n  <td>Z<\/td>\n  <td>Zombie<\/td>\n<\/tr>\n<tr>\n  <td>T<\/td>\n  <td>Suspendu<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Un zombie a terminé mais son parent n’a pas récupéré son statut. Un état D persistant peut indiquer un problème I/O ou NFS. Trop de descripteurs entraîne « Too many open files ».<\/p>\n", "text": "```bash\nps aux\npgrep -af java\npgrep -af sqlservr\nps -p 2456 -o pid,ppid,user,stat,etime,%cpu,%mem,cmd\npstree -p\nps -eo pid,ppid,stat,comm | awk '$3 ~ /^Z/'\nps -eo pid,ppid,stat,wchan:32,comm | awk '$3 ~ /^D/'\ncat /proc/2456/limits\nls -1 /proc/2456/fd | wc -l\ncat /proc/sys/fs/file-nr\n```\n| État | Description |\n|---|---|\n| R | Exécutable |\n| S | Attente interruptible |\n| D | Attente non interruptible |\n| Z | Zombie |\n| T | Suspendu |\nUn zombie a terminé mais son parent n’a pas récupéré son statut. Un état D persistant peut indiquer un problème I/O ou NFS. Trop de descripteurs entraîne « Too many open files ».\n", "id": "chapitre-11", "lead": "Identifier les processus actifs, leurs ressources et leur état avant toute intervention.", "example": ["ps aux", "USER   PID  %CPU %MEM COMMAND\ntalend 2456 92.5 12.0 java", "Identifier PID, propriétaire et commande. Une consommation élevée ne justifie pas à elle seule un arrêt."]}, {"title": "Services systemd", "body": "<pre><code class=\"language-bash\">systemctl list-units --type=service --state=running\nsystemctl --failed\nsystemctl status nginx --no-pager\nsystemctl is-active nginx\nsystemctl is-enabled nginx\nsystemctl show nginx -p MainPID -p NRestarts -p ExecMainStatus -p ActiveEnterTimestamp\nsystemctl list-dependencies nginx\njournalctl -u nginx -n 100 --no-pager\njournalctl -u nginx --since '1 hour ago'\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n  <th>État<\/th>\n  <th>Signification<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>active (running)<\/td>\n  <td>En cours<\/td>\n<\/tr>\n<tr>\n  <td>active (exited)<\/td>\n  <td>Commande terminée, unité active<\/td>\n<\/tr>\n<tr>\n  <td>inactive<\/td>\n  <td>Inactif, parfois attendu<\/td>\n<\/tr>\n<tr>\n  <td>failed<\/td>\n  <td>Échec<\/td>\n<\/tr>\n<tr>\n  <td>activating/deactivating<\/td>\n  <td>Transition<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Services possibles : sshd, nginx, httpd, mssql-server, grafana-server, jenkins, docker, chronyd, rsyslog, crond. WSO2 et Talend dépendent de l’installation. Diagnostic : statut → logs → ressources et ports → cause → validation → correction → contrôle.<\/p>\n", "text": "```bash\nsystemctl list-units --type=service --state=running\nsystemctl --failed\nsystemctl status nginx --no-pager\nsystemctl is-active nginx\nsystemctl is-enabled nginx\nsystemctl show nginx -p MainPID -p NRestarts -p ExecMainStatus -p ActiveEnterTimestamp\nsystemctl list-dependencies nginx\njournalctl -u nginx -n 100 --no-pager\njournalctl -u nginx --since '1 hour ago'\n```\n| État | Signification |\n|---|---|\n| active (running) | En cours |\n| active (exited) | Commande terminée, unité active |\n| inactive | Inactif, parfois attendu |\n| failed | Échec |\n| activating/deactivating | Transition |\nServices possibles : sshd, nginx, httpd, mssql-server, grafana-server, jenkins, docker, chronyd, rsyslog, crond. WSO2 et Talend dépendent de l’installation. Diagnostic : statut → logs → ressources et ports → cause → validation → correction → contrôle.\n", "id": "chapitre-12", "lead": "Un service est un composant géré par systemd. Vérifier son état attendu, puis les journaux si nécessaire.", "example": ["systemctl status nginx --no-pager", "Active: active (running)", "Le service est démarré. Vérifier ensuite le port attendu et les erreurs récentes."]}, {"title": "Logs système et applicatifs", "body": "<table>\n<thead>\n<tr>\n  <th>Chemin<\/th>\n  <th>Contenu<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>/var/log/messages<\/td>\n  <td>Système<\/td>\n<\/tr>\n<tr>\n  <td>/var/log/secure<\/td>\n  <td>Authentification<\/td>\n<\/tr>\n<tr>\n  <td>/var/log/cron<\/td>\n  <td>Tâches planifiées<\/td>\n<\/tr>\n<tr>\n  <td>/var/log/audit/audit.log<\/td>\n  <td>Audit<\/td>\n<\/tr>\n<tr>\n  <td>/var/log/dnf.log<\/td>\n  <td>Packages<\/td>\n<\/tr>\n<tr>\n  <td>/var/log/nginx/ et /var/log/httpd/<\/td>\n  <td>Serveurs web<\/td>\n<\/tr>\n<tr>\n  <td>/var/log/journal/<\/td>\n  <td>Journal persistant<\/td>\n<\/tr>\n<tr>\n  <td>/var/opt/mssql/log/<\/td>\n  <td>SQL Server<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<pre><code class=\"language-bash\">head -n 20 /var/log/messages\ntail -n 100 /var/log/messages\ntail -f /var/log/messages\ntail -F /var/log/messages\ngrep -inE 'error|fatal|failed|exception' /var/log/messages\ngrep -inE -C 5 'error|fatal|exception' application.log\nzgrep -inE 'error|exception|failed' application.log.gz\nzless application.log.gz\njournalctl -p err -b\njournalctl -p err --since '24 hours ago'\njournalctl --since '2026-11-26 08:00:00' --until '2026-11-26 09:00:00'\njournalctl -k -p warning --since today\ndu -sh /var/log\ndu -xhd1 /var/log | sort -hr\njournalctl --disk-usage\n<\/code><\/pre>\n<p>DEBUG : détails ; INFO : fonctionnement ; WARNING : anomalie ; ERROR : échec ; CRITICAL/FATAL : grave. Les chemins varient selon configuration.<\/p>\n<table>\n<thead>\n<tr>\n  <th>Erreur<\/th>\n  <th>Piste<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>No space left on device<\/td>\n  <td>Disque/inodes<\/td>\n<\/tr>\n<tr>\n  <td>Permission denied<\/td>\n  <td>ACL/SELinux/permissions<\/td>\n<\/tr>\n<tr>\n  <td>Connection refused/timed out<\/td>\n  <td>Réseau/service<\/td>\n<\/tr>\n<tr>\n  <td>Out of memory<\/td>\n  <td>RAM<\/td>\n<\/tr>\n<tr>\n  <td>Too many open files<\/td>\n  <td>Descripteurs<\/td>\n<\/tr>\n<tr>\n  <td>Read-only file system<\/td>\n  <td>Montage/stockage<\/td>\n<\/tr>\n<tr>\n  <td>Address already in use<\/td>\n  <td>Conflit port<\/td>\n<\/tr>\n<tr>\n  <td>Segmentation fault<\/td>\n  <td>Crash<\/td>\n<\/tr>\n<tr>\n  <td>I/O error<\/td>\n  <td>Stockage<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n", "text": "| Chemin | Contenu |\n|---|---|\n| /var/log/messages | Système |\n| /var/log/secure | Authentification |\n| /var/log/cron | Tâches planifiées |\n| /var/log/audit/audit.log | Audit |\n| /var/log/dnf.log | Packages |\n| /var/log/nginx/ et /var/log/httpd/ | Serveurs web |\n| /var/log/journal/ | Journal persistant |\n| /var/opt/mssql/log/ | SQL Server |\n```bash\nhead -n 20 /var/log/messages\ntail -n 100 /var/log/messages\ntail -f /var/log/messages\ntail -F /var/log/messages\ngrep -inE 'error|fatal|failed|exception' /var/log/messages\ngrep -inE -C 5 'error|fatal|exception' application.log\nzgrep -inE 'error|exception|failed' application.log.gz\nzless application.log.gz\njournalctl -p err -b\njournalctl -p err --since '24 hours ago'\njournalctl --since '2026-11-26 08:00:00' --until '2026-11-26 09:00:00'\njournalctl -k -p warning --since today\ndu -sh /var/log\ndu -xhd1 /var/log | sort -hr\njournalctl --disk-usage\n```\nDEBUG : détails ; INFO : fonctionnement ; WARNING : anomalie ; ERROR : échec ; CRITICAL/FATAL : grave. Les chemins varient selon configuration.\n| Erreur | Piste |\n|---|---|\n| No space left on device | Disque/inodes |\n| Permission denied | ACL/SELinux/permissions |\n| Connection refused/timed out | Réseau/service |\n| Out of memory | RAM |\n| Too many open files | Descripteurs |\n| Read-only file system | Montage/stockage |\n| Address already in use | Conflit port |\n| Segmentation fault | Crash |\n| I/O error | Stockage |\n", "id": "chapitre-13", "lead": "Les journaux permettent de comprendre ce qui s’est produit et à quel moment. Commencer par une période courte et cibler les erreurs.", "example": ["journalctl -p err --since \"24 hours ago\"", "Nov 26 08:41:12 serveur service[123]: Connection refused", "Relever l’heure, le processus et le message ; vérifier la dépendance réseau ou le service ciblé."]}, {"title": "Rotation et compression", "body": "<pre><code class=\"language-bash\">cat /etc/logrotate.conf\nls -l /etc/logrotate.d/\nlogrotate -d /etc/logrotate.conf\n<\/code><\/pre>\n<p>Simulation sans modification. Exemple de configuration à adapter à la réouverture des logs du service :<\/p>\n<pre><code class=\"language-text\">/opt/application/logs/*.log {\n    daily\n    rotate 30\n    compress\n    delaycompress\n    missingok\n    notifempty\n    dateext\n}\n<\/code><\/pre>\n<p>Rotation quotidienne, 30 rotations, compression différée, fichiers manquants ignorés, fichiers vides non tournés, suffixe daté.<\/p>\n<h2>Compression et archives (après validation)<\/h2>\n<pre><code class=\"language-bash\">gzip application-20261101.log\ngzip -k application-20261101.log\ngunzip application-20261101.log.gz\ngzip -t application-20261101.log.gz\ntar -czf logs-novembre.tar.gz logs-novembre/\ntar -tzf logs-novembre.tar.gz\nzip -r logs-novembre.zip logs-novembre/\nunzip -t logs-novembre.zip\n<\/code><\/pre>\n<p>Prévoir l’espace supplémentaire ; préférer un volume approuvé si le disque est presque plein.<\/p>\n<h2>Purge journald (action corrective)<\/h2>\n<pre><code class=\"language-bash\">journalctl --disk-usage\n# Après validation de la rétention :\njournalctl --rotate --vacuum-size=1G\n# Alternative selon politique :\njournalctl --rotate --vacuum-time=30d\njournalctl --disk-usage\ndf -h\n<\/code><\/pre>\n<p>La rotation archive les journaux actifs, puis vacuum supprime les archives anciennes selon la limite. Ce n’est pas une purge de tous les logs /var/log.<\/p>\n", "text": "```bash\ncat /etc/logrotate.conf\nls -l /etc/logrotate.d/\nlogrotate -d /etc/logrotate.conf\n```\nSimulation sans modification. Exemple de configuration à adapter à la réouverture des logs du service :\n```text\n/opt/application/logs/*.log {\n    daily\n    rotate 30\n    compress\n    delaycompress\n    missingok\n    notifempty\n    dateext\n}\n```\nRotation quotidienne, 30 rotations, compression différée, fichiers manquants ignorés, fichiers vides non tournés, suffixe daté.\n## Compression et archives (après validation)\n```bash\ngzip application-20261101.log\ngzip -k application-20261101.log\ngunzip application-20261101.log.gz\ngzip -t application-20261101.log.gz\ntar -czf logs-novembre.tar.gz logs-novembre/\ntar -tzf logs-novembre.tar.gz\nzip -r logs-novembre.zip logs-novembre/\nunzip -t logs-novembre.zip\n```\nPrévoir l’espace supplémentaire ; préférer un volume approuvé si le disque est presque plein.\n## Purge journald (action corrective)\n```bash\njournalctl --disk-usage\n# Après validation de la rétention :\njournalctl --rotate --vacuum-size=1G\n# Alternative selon politique :\njournalctl --rotate --vacuum-time=30d\njournalctl --disk-usage\ndf -h\n```\nLa rotation archive les journaux actifs, puis vacuum supprime les archives anciennes selon la limite. Ce n’est pas une purge de tous les logs /var/log.\n", "id": "chapitre-14", "lead": "La rotation et la compression limitent la croissance des journaux. Le nettoyage est une intervention distincte, soumise à validation.", "example": ["journalctl --disk-usage", "Archived and active journals take up 2.5G in the file system.", "Mesurer avant d’agir. Ne nettoyer qu’après validation de la rétention."]}, {"title": "Sauvegardes et rétention", "body": "<pre><code class=\"language-bash\">ls -lh /backup\ndu -sh /backup\nls -lht /backup | head -n 15\nfind /backup -type f -mtime +30 -print\nfind /backup -type f -newermt '2026-05-01' ! -newermt '2026-06-01'\nfind /backup -type f -name '*.bak' -printf '%s\\n' | awk '{s+=$1} END {printf &quot;%.2f GiB\\n&quot;,s/1024/1024/1024}'\nsystemctl status crond\ncrontab -l\nls -l /etc/cron.d/\nsystemctl list-timers --all\ntail -n 100 /var/log/cron\n<\/code><\/pre>\n<p>Vérifier présence, date, taille, exécution, intégrité et restauration. La date de modification n’est pas nécessairement la date de sauvegarde ; mtime est arrondi par jours. Exemple fictif de rétention : quotidien 30 jours, hebdomadaire 90 jours, mensuel 12 mois. Appliquer exclusivement la politique validée et les dépendances de restauration.<\/p>\n", "text": "```bash\nls -lh /backup\ndu -sh /backup\nls -lht /backup | head -n 15\nfind /backup -type f -mtime +30 -print\nfind /backup -type f -newermt '2026-05-01' ! -newermt '2026-06-01'\nfind /backup -type f -name '*.bak' -printf '%s\\n' | awk '{s+=$1} END {printf \"%.2f GiB\\n\",s/1024/1024/1024}'\nsystemctl status crond\ncrontab -l\nls -l /etc/cron.d/\nsystemctl list-timers --all\ntail -n 100 /var/log/cron\n```\nVérifier présence, date, taille, exécution, intégrité et restauration. La date de modification n’est pas nécessairement la date de sauvegarde ; mtime est arrondi par jours. Exemple fictif de rétention : quotidien 30 jours, hebdomadaire 90 jours, mensuel 12 mois. Appliquer exclusivement la politique validée et les dépendances de restauration.\n", "id": "chapitre-15", "lead": "Vérifier la présence, la fraîcheur et la rétention des sauvegardes. Leur existence ne prouve pas leur restaurabilité.", "example": ["ls -lht /backup | head -n 15", "-rw------- 1 root root 2.1G Nov 26 02:00 db_FULL_20261126.bak", "Vérifier la date et la taille par rapport au planning ; confirmer aussi le résultat du job."]}, {"id": "chapitre-16", "title": "Libérer le disque SQL Server (backups DIFF)", "lead": "Identifier et mesurer uniquement les sauvegardes différentielles concernées.", "body": "<h2>1. Situation<\/h2><p>La partition SQL Server était à 95 %. Le périmètre approuvé concernait les sauvegardes différentielles de mai 2026, pas les fichiers de données ni les autres backups.<\/p><h2>2. Localiser la consommation<\/h2><p>Identifier le filesystem concerné.<\/p><pre><code>df -h /var/opt/mssql<\/code><\/pre><p>Comparer data, log et backup. Ne jamais supprimer manuellement les MDF, NDF ou LDF actifs.<\/p><pre><code>du -xhd1 /var/opt/mssql | sort -hr<\/code><\/pre><h2>3. Sélectionner uniquement les DIFF de mai<\/h2><p>Afficher les chemins correspondant au motif glob (pas une regex).<\/p><pre><code>find /var/opt/mssql/backup -type f -name &#x27;*_DIFF_202605*.bak&#x27; -print<\/code><\/pre><div class=\"output-label\">Exemple fictif de résultat<\/div><div class=\"sample\"><pre>/var/opt/mssql/backup/CRM_DIFF_20260512.bak<\/pre><\/div><table><thead><tr><th>Élément<\/th><th>Signification<\/th><\/tr><\/thead><tbody><tr><td><code>*<\/code><\/td><td>Zéro ou plusieurs caractères.<\/td><\/tr><tr><td><code>_DIFF_<\/code><\/td><td>Texte exact désignant le type différentiel selon la convention.<\/td><\/tr><tr><td><code>202605<\/code><\/td><td>Année 2026 et mois 05.<\/td><\/tr><tr><td><code>*.bak<\/code><\/td><td>Suite éventuelle de caractères puis extension .bak.<\/td><\/tr><tr><td><code>&#x27;...&#x27;<\/code><\/td><td>Empêche le shell de développer le motif avant find.<\/td><\/tr><tr><td><code>-print<\/code><\/td><td>Affiche le chemin, sans supprimer.<\/td><\/tr><\/tbody><\/table><h2>4. Compter et mesurer<\/h2><p>wc -l compte les lignes (un chemin par ligne pour les noms habituels).<\/p><pre><code>find /var/opt/mssql/backup -type f -name &#x27;*_DIFF_202605*.bak&#x27; -print | wc -l<\/code><\/pre><p> %s affiche la taille en octets ; awk additionne la première colonne ($1), puis convertit en Gio à la fin.<\/p><pre><code>find /var/opt/mssql/backup -type f -name &#x27;*_DIFF_202605*.bak&#x27; -printf &#x27;%s\\n&#x27; | awk &#x27;{s+=$1} END {printf &quot;%.2f GiB\\n&quot;, s/1024/1024/1024}&#x27;<\/code><\/pre><h2>5. Valider puis contrôler<\/h2><p>Faire valider la liste exacte et la chaîne de restauration par le DBA avant toute suppression. Refaire les commandes de comptage et df -h après l’intervention. Résultat constaté : <strong>95 % → 93 % → 78 %<\/strong>.<\/p>", "text": "1. Situation La partition SQL Server était à 95 %. Le périmètre approuvé concernait les sauvegardes différentielles de mai 2026, pas les fichiers de données ni les autres backups. 2. Localiser la consommation Identifier le filesystem concerné. df -h /var/opt/mssql Comparer data, log et backup. Ne jamais supprimer manuellement les MDF, NDF ou LDF actifs. du -xhd1 /var/opt/mssql | sort -hr 3. Sélectionner uniquement les DIFF de mai Afficher les chemins correspondant au motif glob (pas une regex). find /var/opt/mssql/backup -type f -name '*_DIFF_202605*.bak' -print Exemple fictif de résultat /var/opt/mssql/backup/CRM_DIFF_20260512.bak Élément Signification * Zéro ou plusieurs caractères. _DIFF_ Texte exact désignant le type différentiel selon la convention. 202605 Année 2026 et mois 05. *.bak Suite éventuelle de caractères puis extension .bak. '...' Empêche le shell de développer le motif avant find. -print Affiche le chemin, sans supprimer. 4. Compter et mesurer wc -l compte les lignes (un chemin par ligne pour les noms habituels). find /var/opt/mssql/backup -type f -name '*_DIFF_202605*.bak' -print | wc -l %s affiche la taille en octets ; awk additionne la première colonne ($1), puis convertit en Gio à la fin. find /var/opt/mssql/backup -type f -name '*_DIFF_202605*.bak' -printf '%s\\n' | awk '{s+=$1} END {printf \"%.2f GiB\\n\", s/1024/1024/1024}' 5. Valider puis contrôler Faire valider la liste exacte et la chaîne de restauration par le DBA avant toute suppression. Refaire les commandes de comptage et df -h après l’intervention. Résultat constaté : 95 % → 93 % → 78 % .", "example": null, "practice": true}, {"id": "chapitre-17", "title": "Trier les backups Talend par mois", "lead": "Comprendre find, grep et les expressions régulières à partir d’une intervention réelle.", "body": "<h2>1. Comprendre la situation<\/h2><p>Lors de l’intervention Talend ESB, le disque était occupé à 90 %. La consigne validée consistait à retirer les sauvegardes de février à juin 2026. Le chemin ci-dessous est illustratif : confirmer le répertoire réel.<\/p><h2>2. Identifier le stockage concerné<\/h2><p>Vérifier le taux d’occupation du système de fichiers contenant les sauvegardes.<\/p><pre><code>df -h /opt/talend/backup<\/code><\/pre><p>Mesurer les répertoires sur le même filesystem, puis classer les tailles par ordre décroissant.<\/p><pre><code>du -xhd1 /opt/talend/backup | sort -hr<\/code><\/pre><h2>3. Rechercher les sauvegardes par mois<\/h2><p>Lister uniquement les noms des fichiers, puis retenir ceux qui contiennent une date correspondant à la période.<\/p><pre><code>find /opt/talend/backup -type f -printf &#x27;%f\\n&#x27; | grep -E &#x27;2026(02|03|04|05|06)[0-9]{2}&#x27;<\/code><\/pre><div class=\"output-label\">Exemple fictif de résultat<\/div><div class=\"sample\"><pre>backup_20260218.zip\nbackup_20260410.zip\nbackup_20260625.zip<\/pre><\/div><table><thead><tr><th>Élément<\/th><th>Signification<\/th><\/tr><\/thead><tbody><tr><td><code>find /opt/talend/backup<\/code><\/td><td>Explorer ce répertoire et ses sous-répertoires.<\/td><\/tr><tr><td><code>-type f<\/code><\/td><td>Retenir uniquement les fichiers ordinaires.<\/td><\/tr><tr><td><code>-printf &#x27;%f\\n&#x27;<\/code><\/td><td>%f affiche le nom seul ; \\n ajoute un retour à la ligne.<\/td><\/tr><tr><td><code>|<\/code><\/td><td>Transmet la sortie de find à grep.<\/td><\/tr><tr><td><code>grep -E<\/code><\/td><td>Filtre les lignes avec une expression régulière étendue.<\/td><\/tr><tr><td><code>2026<\/code><\/td><td>Année littérale.<\/td><\/tr><tr><td><code>(02|03|04|05|06)<\/code><\/td><td>Un des cinq mois autorisés ; | signifie OU dans la regex.<\/td><\/tr><tr><td><code>[0-9]{2}<\/code><\/td><td>Exactement deux chiffres consécutifs, représentant le jour.<\/td><\/tr><\/tbody><\/table><p>Le motif cherche une sous-chaîne : il peut accepter une date impossible (20260299) ou une suite de chiffres plus longue. Il ne prouve pas que le fichier est une sauvegarde. Vérifier la convention réelle des noms et l’extension.<\/p><h2>4. Tester le pattern sans toucher au serveur<\/h2><div class=\"tools\" id=\"regexlab\"><label>Expression régulière<input id=\"rx\" value=\"2026(02|03|04|05|06)[0-9]{2}\"><\/label><label>Noms de fichiers (un par ligne)<textarea id=\"rxnames\" rows=\"7\">backup_20260115.zip\nbackup_20260218.zip\nbackup_20260320.zip\nbackup_20260625.zip\nbackup_20260701.zip\nbackup_20260299.zip<\/textarea><\/label><div id=\"rxout\" aria-live=\"polite\"><\/div><p>Simulation JavaScript des motifs simples de grep -E ; ce n’est pas une exécution Linux.<\/p><\/div><h2>5. Adapter le filtre et compter les fichiers<\/h2><p>grep -o affiche uniquement le fragment trouvé ; sort regroupe les mois identiques ; uniq -c compte les occurrences adjacentes. Ce comptage suppose une seule date pertinente par nom.<\/p><pre><code>find /opt/talend/backup -type f -printf &#x27;%f\\n&#x27; | grep -E &#x27;2026(02|03|04|05|06)[0-9]{2}&#x27; | grep -oE &#x27;2026(02|03|04|05|06)&#x27; | sort | uniq -c<\/code><\/pre><h2>6. Prévisualiser les chemins avant toute correction<\/h2><p>Exemple si les sauvegardes sont des ZIP : afficher les chemins complets, confirmer les dates et la rétention. Ne pas supprimer à partir de la seule liste de noms.<\/p><pre><code>find /opt/talend/backup -type f -name &#x27;*.zip&#x27; -print<\/code><\/pre><p>Après validation du propriétaire des sauvegardes, supprimer uniquement la liste exacte approuvée selon la procédure interne. Vérifier ensuite avec df -h et contrôler les services concernés.<\/p><h2>7. Résultat constaté<\/h2><p><strong>90 % → 53 %<\/strong> : réduction de 37 points de pourcentage. Les noms de fichiers présentés ici sont fictifs.<\/p>", "text": "1. Comprendre la situation Lors de l’intervention Talend ESB, le disque était occupé à 90 %. La consigne validée consistait à retirer les sauvegardes de février à juin 2026. Le chemin ci-dessous est illustratif : confirmer le répertoire réel. 2. Identifier le stockage concerné Vérifier le taux d’occupation du système de fichiers contenant les sauvegardes. df -h /opt/talend/backup Mesurer les répertoires sur le même filesystem, puis classer les tailles par ordre décroissant. du -xhd1 /opt/talend/backup | sort -hr 3. Rechercher les sauvegardes par mois Lister uniquement les noms des fichiers, puis retenir ceux qui contiennent une date correspondant à la période. find /opt/talend/backup -type f -printf '%f\\n' | grep -E '2026(02|03|04|05|06)[0-9]{2}' Exemple fictif de résultat backup_20260218.zip\nbackup_20260410.zip\nbackup_20260625.zip Élément Signification find /opt/talend/backup Explorer ce répertoire et ses sous-répertoires. -type f Retenir uniquement les fichiers ordinaires. -printf '%f\\n' %f affiche le nom seul ; \\n ajoute un retour à la ligne. | Transmet la sortie de find à grep. grep -E Filtre les lignes avec une expression régulière étendue. 2026 Année littérale. (02|03|04|05|06) Un des cinq mois autorisés ; | signifie OU dans la regex. [0-9]{2} Exactement deux chiffres consécutifs, représentant le jour. Le motif cherche une sous-chaîne : il peut accepter une date impossible (20260299) ou une suite de chiffres plus longue. Il ne prouve pas que le fichier est une sauvegarde. Vérifier la convention réelle des noms et l’extension. 4. Tester le pattern sans toucher au serveur Expression régulière Noms de fichiers (un par ligne) backup_20260115.zip\nbackup_20260218.zip\nbackup_20260320.zip\nbackup_20260625.zip\nbackup_20260701.zip\nbackup_20260299.zip Simulation JavaScript des motifs simples de grep -E ; ce n’est pas une exécution Linux. 5. Adapter le filtre et compter les fichiers grep -o affiche uniquement le fragment trouvé ; sort regroupe les mois identiques ; uniq -c compte les occurrences adjacentes. Ce comptage suppose une seule date pertinente par nom. find /opt/talend/backup -type f -printf '%f\\n' | grep -E '2026(02|03|04|05|06)[0-9]{2}' | grep -oE '2026(02|03|04|05|06)' | sort | uniq -c 6. Prévisualiser les chemins avant toute correction Exemple si les sauvegardes sont des ZIP : afficher les chemins complets, confirmer les dates et la rétention. Ne pas supprimer à partir de la seule liste de noms. find /opt/talend/backup -type f -name '*.zip' -print Après validation du propriétaire des sauvegardes, supprimer uniquement la liste exacte approuvée selon la procédure interne. Vérifier ensuite avec df -h et contrôler les services concernés. 7. Résultat constaté 90 % → 53 % : réduction de 37 points de pourcentage. Les noms de fichiers présentés ici sont fictifs.", "example": null, "practice": true}, {"id": "pratique-journaux", "title": "Réduire la taille des journaux WSO2 / Grafana", "lead": "Comprendre journalctl, la rotation et la rétention sans effacer tous les logs.", "body": "<h2>1. Identifier les journaux volumineux<\/h2><p>-x limite au filesystem ; -h rend les tailles lisibles ; -d1 limite la profondeur ; sort -hr trie les tailles humaines en ordre inverse.<\/p><pre><code>du -xhd1 /var/log | sort -hr<\/code><\/pre><p>Mesurer la place occupée par les journaux systemd.<\/p><pre><code>journalctl --disk-usage<\/code><\/pre><h2>2. Lire les événements avant nettoyage<\/h2><p>Afficher les cinq premières lignes pour reconnaître le format et les dates.<\/p><pre><code>head -n 5 /var/log/messages<\/code><\/pre><p>Consulter les erreurs récentes. Préserver les événements utiles à un incident.<\/p><pre><code>journalctl -p err --since &quot;24 hours ago&quot;<\/code><\/pre><h2>3. Comprendre la rotation et la purge<\/h2><p>Action de maintenance déjà étudiée sur le serveur WSO2/Grafana : uniquement après autorisation et validation de la rétention.<\/p><pre><code>journalctl --rotate --vacuum-size=1G<\/code><\/pre><table><thead><tr><th>Élément<\/th><th>Signification<\/th><\/tr><\/thead><tbody><tr><td><code>--rotate<\/code><\/td><td>Archive les journaux actifs et ouvre de nouveaux journaux.<\/td><\/tr><tr><td><code>--vacuum-size=1G<\/code><\/td><td>Supprime les plus anciens journaux archivés pour viser au maximum 1 Gio d’archives.<\/td><\/tr><tr><td><code>1G<\/code><\/td><td>Limite de taille, pas une durée de conservation.<\/td><\/tr><\/tbody><\/table><p>La taille totale peut dépasser 1 Gio à cause des journaux actifs. Cette commande ne nettoie pas /var/log/messages ni les logs applicatifs indépendants.<\/p><h2>4. Vérifier après intervention<\/h2><p>Comparer les valeurs avant/après. Aucun chiffre de résultat n’est fourni pour ce cas.<\/p><pre><code>journalctl --disk-usage\ndf -h<\/code><\/pre>", "text": "1. Identifier les journaux volumineux -x limite au filesystem ; -h rend les tailles lisibles ; -d1 limite la profondeur ; sort -hr trie les tailles humaines en ordre inverse. du -xhd1 /var/log | sort -hr Mesurer la place occupée par les journaux systemd. journalctl --disk-usage 2. Lire les événements avant nettoyage Afficher les cinq premières lignes pour reconnaître le format et les dates. head -n 5 /var/log/messages Consulter les erreurs récentes. Préserver les événements utiles à un incident. journalctl -p err --since \"24 hours ago\" 3. Comprendre la rotation et la purge Action de maintenance déjà étudiée sur le serveur WSO2/Grafana : uniquement après autorisation et validation de la rétention. journalctl --rotate --vacuum-size=1G Élément Signification --rotate Archive les journaux actifs et ouvre de nouveaux journaux. --vacuum-size=1G Supprime les plus anciens journaux archivés pour viser au maximum 1 Gio d’archives. 1G Limite de taille, pas une durée de conservation. La taille totale peut dépasser 1 Gio à cause des journaux actifs. Cette commande ne nettoie pas /var/log/messages ni les logs applicatifs indépendants. 4. Vérifier après intervention Comparer les valeurs avant/après. Aucun chiffre de résultat n’est fourni pour ce cas. journalctl --disk-usage\ndf -h", "example": null, "practice": true}, {"id": "pratique-recherche", "title": "Retrouver un fichier et comprendre les filtres", "lead": "Apprendre les wildcards, les dates et les tailles avec find.", "body": "<h2>1. Retrouver un script<\/h2><p>Rechercher le nom exact dans /opt. Élargir seulement si nécessaire, pour limiter les I/O.<\/p><pre><code>find /opt -type f -name &#x27;mesure.sh&#x27;<\/code><\/pre><h2>2. Trouver les fichiers volumineux<\/h2><p>Chercher les fichiers de plus de 1 Gio sur le filesystem de /var.<\/p><pre><code>find /var -xdev -type f -size +1G -print<\/code><\/pre><table><thead><tr><th>Élément<\/th><th>Signification<\/th><\/tr><\/thead><tbody><tr><td><code>-xdev<\/code><\/td><td>Ne pas traverser vers un autre filesystem.<\/td><\/tr><tr><td><code>-size +1G<\/code><\/td><td>Taille arrondie en unités Gio, supérieure à une unité.<\/td><\/tr><tr><td><code>-name<\/code><\/td><td>Filtre sur le nom via un glob.<\/td><\/tr><tr><td><code>-iname<\/code><\/td><td>Même filtre, sans distinction majuscule/minuscule.<\/td><\/tr><\/tbody><\/table><h2>3. Distinguer glob et regex<\/h2><table><thead><tr><th>Élément<\/th><th>Signification<\/th><\/tr><\/thead><tbody><tr><td><code>*.log<\/code><\/td><td>Glob find : tout nom se terminant par .log.<\/td><\/tr><tr><td><code>.*\\.log$<\/code><\/td><td>Regex grep : tout texte se terminant par .log ; \\. représente le point littéral.<\/td><\/tr><tr><td><code>^backup_<\/code><\/td><td>Regex : début de ligne backup_.<\/td><\/tr><tr><td><code>[0-9]{2}<\/code><\/td><td>Regex étendue : deux chiffres exactement.<\/td><\/tr><\/tbody><\/table><h2>4. Rechercher par ancienneté<\/h2><p>Sélectionne les fichiers dont l’âge de modification, arrondi en périodes de 24 h, dépasse 30. Ce n’est pas la date de création.<\/p><pre><code>find /backup -type f -mtime +30 -print<\/code><\/pre><p>Ces recherches sont en lecture seule. Les chemins et résultats sont à adapter au serveur.<\/p>", "text": "1. Retrouver un script Rechercher le nom exact dans /opt. Élargir seulement si nécessaire, pour limiter les I/O. find /opt -type f -name 'mesure.sh' 2. Trouver les fichiers volumineux Chercher les fichiers de plus de 1 Gio sur le filesystem de /var. find /var -xdev -type f -size +1G -print Élément Signification -xdev Ne pas traverser vers un autre filesystem. -size +1G Taille arrondie en unités Gio, supérieure à une unité. -name Filtre sur le nom via un glob. -iname Même filtre, sans distinction majuscule/minuscule. 3. Distinguer glob et regex Élément Signification *.log Glob find : tout nom se terminant par .log. .*\\.log$ Regex grep : tout texte se terminant par .log ; \\. représente le point littéral. ^backup_ Regex : début de ligne backup_. [0-9]{2} Regex étendue : deux chiffres exactement. 4. Rechercher par ancienneté Sélectionne les fichiers dont l’âge de modification, arrondi en périodes de 24 h, dépasse 30. Ce n’est pas la date de création. find /backup -type f -mtime +30 -print Ces recherches sont en lecture seule. Les chemins et résultats sont à adapter au serveur.", "example": null, "practice": true}, {"title": "Libérer le disque WebLogic (log supprimé mais ouvert)", "id": "pratique-weblogic", "lead": "Comprendre un écart entre df et du, identifier un fichier supprimé encore ouvert et vérifier la libération du stockage.", "body": "<p>Incident du 24 novembre 2026 — srv-appmid-wl, WebLogic / OSB, OSBSERVER1. Les résultats ci-dessous sont des extraits ou synthèses des observations retrouvées, pas une transcription intégrale du terminal. Les champs absents sont signalés.<\/p><h2>1. Confirmer la saturation<\/h2><pre><code>df -h /opt<\/code><\/pre><div class=\"output-label\">Résultat observé — extrait ou synthèse<\/div><div class=\"sample\"><pre>/dev/vda1  397G  377G  0  100%  /opt<\/pre><\/div><p><strong>Interprétation :<\/strong> La partition est pleine. Aucun espace disponible pour les écritures ordinaires.<\/p><h2>2. Vérifier les inodes<\/h2><pre><code>df -i /opt<\/code><\/pre><div class=\"output-label\">Résultat observé — extrait ou synthèse<\/div><div class=\"sample\"><pre>IUse% : 12 %<\/pre><\/div><p><strong>Interprétation :<\/strong> Les inodes ne sont pas saturés. Le problème concerne les blocs de stockage.<\/p><h2>3. Chercher les répertoires volumineux<\/h2><pre><code>du -xh --max-depth=1 /opt | sort -hr | head -10<\/code><\/pre><div class=\"output-label\">Résultat observé — extrait ou synthèse<\/div><div class=\"sample\"><pre>31G  /opt\n25G  /opt/Oracle<\/pre><\/div><p><strong>Interprétation :<\/strong> df indique 377G mais du ne retrouve que 31G : environ 346G restent inexpliqués. -x limite au même système de fichiers ; -h affiche les tailles lisibles ; sort -hr trie du plus grand au plus petit ; head limite à dix lignes.<\/p><h2>4. Identifier les fichiers supprimés encore ouverts<\/h2><pre><code>lsof -nP +L1 | head -30<\/code><\/pre><div class=\"output-label\">Résultat observé — extrait ou synthèse<\/div><div class=\"sample\"><pre>COMMAND   PID     USER   FD  TYPE DEVICE SIZE/OFF      NLINK NODE\nstartWebL 204032  wlapp  1w  REG  252,1  371276582912  0     9964460\njava      204099  …      …   …    …      …             …     9964460\nNAME : …/OSBSERVER1/logs/OSBSERVER1.out (deleted)<\/pre><\/div><p><strong>Interprétation :<\/strong> +L1 sélectionne les fichiers sans lien (NLINK=0). -n désactive la résolution DNS et -P la conversion des ports. Les deux processus référencent le même inode 9964460 : ne pas additionner leurs tailles.<\/p><h2>5. Identifier les processus<\/h2><pre><code>ps -fp 204032,204099<\/code><\/pre><div class=\"output-label\">Résultat observé — extrait ou synthèse<\/div><div class=\"sample\"><pre>PID 204032 : startWebLogic.sh\nPID 204099 : Java<\/pre><\/div><p><strong>Interprétation :<\/strong> -f affiche les détails ; -p sélectionne les PID. Les deux processus appartiennent à WebLogic.<\/p><h2>6. Vérifier le descripteur ouvert<\/h2><pre><code>ls -l /proc/204032/fd/1<\/code><\/pre><div class=\"output-label\">Résultat observé — extrait ou synthèse<\/div><div class=\"sample\"><pre>/proc/204032/fd/1 -&gt; …/OSBSERVER1.out (deleted)<\/pre><\/div><p><strong>Interprétation :<\/strong> Le descripteur 1 correspond à stdout. Le lien permet encore d’accéder au fichier supprimé. Le descripteur 2 correspond à stderr.<\/p><h2>7. Mesurer le fichier invisible<\/h2><pre><code>du -hL /proc/204032/fd/1<\/code><\/pre><div class=\"output-label\">Résultat observé — extrait ou synthèse<\/div><div class=\"sample\"><pre>346G  /proc/204032/fd/1<\/pre><\/div><p><strong>Interprétation :<\/strong> -L suit le lien symbolique. La taille retrouvée explique l’écart entre df et du. Le fichier visible OSBSERVER1.out était distinct et vide (0 octet).<\/p><h2>8. Examiner les dernières lignes<\/h2><pre><code>tail -n 30 /proc/204032/fd/1<\/code><\/pre><div class=\"output-label\">Résultat observé — extrait ou synthèse<\/div><div class=\"sample\"><pre>Sortie détaillée non retrouvée.<\/pre><\/div><p><strong>Interprétation :<\/strong> Cette commande lit les 30 dernières lignes du journal. Le contenu exact ne doit pas être inventé.<\/p><h2>9. Action corrective réalisée<\/h2><pre><code>&gt; /proc/204032/fd/1<\/code><\/pre><div class=\"output-label\">Résultat observé — extrait ou synthèse<\/div><div class=\"sample\"><pre>Aucune sortie terminal documentée.<\/pre><\/div><p><strong>Interprétation :<\/strong> La redirection tronque le fichier ouvert. Action destructive : validation, préservation des logs et vérification du PID, du descripteur et de l’inode indispensables. Préférer une réouverture des logs supportée par le service lorsque possible.<\/p><h2>10. Vérifier la libération du stockage<\/h2><pre><code>df -h /opt<\/code><\/pre><div class=\"output-label\">Résultat observé — extrait ou synthèse<\/div><div class=\"sample\"><pre>Utilisé : 29G | Disponible : 348G | Utilisation : 8 %<\/pre><\/div><p><strong>Interprétation :<\/strong> La partition est passée de 100 % à 8 %, sans redémarrage WebLogic. Le log ouvert était ensuite d’environ 5,5 Mo selon le compte rendu. La validation fonctionnelle et la cause de croissance restent à confirmer.<\/p><h2>11. Prévenir la récidive<\/h2><p>Contrôler la rotation de stdout, la rétention et la croissance des logs. Ne pas supprimer un journal actif manuellement. Vérifier les services et les nouveaux logs après intervention.<\/p>", "text": "# Libérer le disque WebLogic (log supprimé mais ouvert)\n\nIncident du 24 novembre 2026 — srv-appmid-wl, WebLogic / OSB, OSBSERVER1. Les résultats ci-dessous sont des extraits ou synthèses des observations retrouvées, pas une transcription intégrale du terminal. Les champs absents sont signalés.\n\n## 1. Confirmer la saturation\n\n```bash\ndf -h /opt\n```\n\n**Résultat observé — extrait ou synthèse**\n\n```text\n/dev/vda1  397G  377G  0  100%  /opt\n```\n\n**Interprétation :** La partition est pleine. Aucun espace disponible pour les écritures ordinaires.\n\n## 2. Vérifier les inodes\n\n```bash\ndf -i /opt\n```\n\n**Résultat observé — extrait ou synthèse**\n\n```text\nIUse% : 12 %\n```\n\n**Interprétation :** Les inodes ne sont pas saturés. Le problème concerne les blocs de stockage.\n\n## 3. Chercher les répertoires volumineux\n\n```bash\ndu -xh --max-depth=1 /opt | sort -hr | head -10\n```\n\n**Résultat observé — extrait ou synthèse**\n\n```text\n31G  /opt\n25G  /opt/Oracle\n```\n\n**Interprétation :** df indique 377G mais du ne retrouve que 31G : environ 346G restent inexpliqués. -x limite au même système de fichiers ; -h affiche les tailles lisibles ; sort -hr trie du plus grand au plus petit ; head limite à dix lignes.\n\n## 4. Identifier les fichiers supprimés encore ouverts\n\n```bash\nlsof -nP +L1 | head -30\n```\n\n**Résultat observé — extrait ou synthèse**\n\n```text\nCOMMAND   PID     USER   FD  TYPE DEVICE SIZE/OFF      NLINK NODE\nstartWebL 204032  wlapp  1w  REG  252,1  371276582912  0     9964460\njava      204099  …      …   …    …      …             …     9964460\nNAME : …/OSBSERVER1/logs/OSBSERVER1.out (deleted)\n```\n\n**Interprétation :** +L1 sélectionne les fichiers sans lien (NLINK=0). -n désactive la résolution DNS et -P la conversion des ports. Les deux processus référencent le même inode 9964460 : ne pas additionner leurs tailles.\n\n## 5. Identifier les processus\n\n```bash\nps -fp 204032,204099\n```\n\n**Résultat observé — extrait ou synthèse**\n\n```text\nPID 204032 : startWebLogic.sh\nPID 204099 : Java\n```\n\n**Interprétation :** -f affiche les détails ; -p sélectionne les PID. Les deux processus appartiennent à WebLogic.\n\n## 6. Vérifier le descripteur ouvert\n\n```bash\nls -l /proc/204032/fd/1\n```\n\n**Résultat observé — extrait ou synthèse**\n\n```text\n/proc/204032/fd/1 -> …/OSBSERVER1.out (deleted)\n```\n\n**Interprétation :** Le descripteur 1 correspond à stdout. Le lien permet encore d’accéder au fichier supprimé. Le descripteur 2 correspond à stderr.\n\n## 7. Mesurer le fichier invisible\n\n```bash\ndu -hL /proc/204032/fd/1\n```\n\n**Résultat observé — extrait ou synthèse**\n\n```text\n346G  /proc/204032/fd/1\n```\n\n**Interprétation :** -L suit le lien symbolique. La taille retrouvée explique l’écart entre df et du. Le fichier visible OSBSERVER1.out était distinct et vide (0 octet).\n\n## 8. Examiner les dernières lignes\n\n```bash\ntail -n 30 /proc/204032/fd/1\n```\n\n**Résultat observé — extrait ou synthèse**\n\n```text\nSortie détaillée non retrouvée.\n```\n\n**Interprétation :** Cette commande lit les 30 dernières lignes du journal. Le contenu exact ne doit pas être inventé.\n\n## 9. Action corrective réalisée\n\n```bash\n> /proc/204032/fd/1\n```\n\n**Résultat observé — extrait ou synthèse**\n\n```text\nAucune sortie terminal documentée.\n```\n\n**Interprétation :** La redirection tronque le fichier ouvert. Action destructive : validation, préservation des logs et vérification du PID, du descripteur et de l’inode indispensables. Préférer une réouverture des logs supportée par le service lorsque possible.\n\n## 10. Vérifier la libération du stockage\n\n```bash\ndf -h /opt\n```\n\n**Résultat observé — extrait ou synthèse**\n\n```text\nUtilisé : 29G | Disponible : 348G | Utilisation : 8 %\n```\n\n**Interprétation :** La partition est passée de 100 % à 8 %, sans redémarrage WebLogic. Le log ouvert était ensuite d’environ 5,5 Mo selon le compte rendu. La validation fonctionnelle et la cause de croissance restent à confirmer.\n\n## 11. Prévenir la récidive\n\nContrôler la rotation de stdout, la rétention et la croissance des logs. Ne pas supprimer un journal actif manuellement. Vérifier les services et les nouveaux logs après intervention.\n", "practice": true, "example": null}, {"title": "Vider un fichier de log sans le supprimer (Truncate)", "id": "pratique-truncate", "lead": "Libérer de l’espace en conservant le fichier et comprendre les trois méthodes de troncature.", "body": "<h2>1. Situation rencontrée<\/h2>\n<p>Lors du Health Check WSO2 / Grafana, un fichier <code>/var/log/kibana/kibana.log<\/code> de 11 Go a été identifié dans nos échanges. La sortie terminal originale et le résultat d'une éventuelle troncature de ce fichier ne sont pas disponibles ici. Les commandes et résultats ci-dessous constituent donc un exemple pédagogique, distinct de l'intervention WebLogic confirmée dans le chapitre précédent.<\/p>\n<h2>2. Identifier le fichier et vérifier son état<\/h2>\n<p>Vérifier la taille, l'inode et les processus qui utilisent le fichier avant toute décision.<\/p>\n<pre><code class=\"language-bash\">ls -lh /var/log/kibana/kibana.log\nstat /var/log/kibana/kibana.log\nlsof /var/log/kibana/kibana.log\ndf -h /var/log/kibana\n<\/code><\/pre>\n<p><code>ls -lh<\/code> affiche la taille lisible ; <code>stat<\/code> affiche notamment l'inode et les métadonnées ; <code>lsof<\/code> identifie les processus ayant ouvert le fichier ; <code>df<\/code> mesure le stockage du système de fichiers.<\/p>\n<div class=\"output-label\">Exemple de résultat (fictif)<\/div><div class=\"sample\"><pre><code class=\"language-text\">Taille : 11G\nInode : 123456\n<\/code><\/pre><\/div>\n<h2>3. Pourquoi vider plutôt que supprimer ?<\/h2>\n<p>Un processus peut continuer à écrire dans un fichier supprimé tant que son descripteur reste ouvert. La troncature conserve le nom et l'inode du fichier existant, mais ramène sa taille à zéro. Elle détruit son contenu ; elle ne ferme pas les descripteurs ni ne réinitialise nécessairement leur position d'écriture.<\/p>\n<h2>4. Tester la méthode sur un fichier de laboratoire<\/h2>\n<pre><code class=\"language-bash\">lab=$(mktemp -d)\nprintf 'INFO : exemple de journal\\n' &gt; &quot;$lab/demo.log&quot;\nls -li &quot;$lab/demo.log&quot;\ntruncate -s 0 &quot;$lab/demo.log&quot;\nls -li &quot;$lab/demo.log&quot;\n<\/code><\/pre>\n<div class=\"output-label\">Exemple de résultat (fictif)<\/div><div class=\"sample\"><pre><code class=\"language-text\">Avant : inode 123456, taille 26 octets\nAprès : inode 123456, taille 0 octet\n<\/code><\/pre><\/div>\n<p>Le fichier existe toujours et son inode reste identique. <code>-s 0<\/code> signifie fixer la taille à zéro octet.<\/p>\n<h2>5. Trois méthodes équivalentes sur un fichier existant<\/h2>\n<p>Choisir une seule méthode. Les exemples utilisent le fichier de laboratoire créé précédemment.<\/p>\n<pre><code class=\"language-bash\">truncate -s 0 &quot;$lab/demo.log&quot;\n<\/code><\/pre>\n<p><code>truncate<\/code> fixe explicitement la taille du fichier.<\/p>\n<pre><code class=\"language-bash\">&gt; &quot;$lab/demo.log&quot;\n<\/code><\/pre>\n<p><code>&gt;<\/code> est une redirection du shell : il ouvre le fichier en écriture et le tronque, même sans commande produisant du texte.<\/p>\n<pre><code class=\"language-bash\">cat /dev/null &gt; &quot;$lab/demo.log&quot;\n<\/code><\/pre>\n<p><code>/dev/null<\/code> ne fournit aucune donnée à la lecture ; la redirection vide le fichier. C'est la redirection, et non <code>cat<\/code>, qui provoque la troncature.<\/p>\n<h2>6. Intervention en production : précautions<\/h2>\n<p>Ne pas tronquer directement un fichier actif sans autorisation du responsable, vérification de la rétention, conservation des preuves nécessaires et confirmation du chemin et de l'inode. Préférer la rotation native du service lorsqu'elle est disponible. Ne jamais utiliser ces méthodes sur des fichiers de données de bases de données. Un processus qui écrit sans mode append peut reprendre à son ancien offset et créer un fichier creux ; surveiller la reprise des écritures. Ces commandes peuvent créer un fichier absent : confirmer son existence avant intervention.<\/p>\n<h2>7. Vérifier après intervention<\/h2>\n<pre><code class=\"language-bash\">ls -li /var/log/kibana/kibana.log\nstat /var/log/kibana/kibana.log\ndf -h /var/log/kibana\nlsof /var/log/kibana/kibana.log\ntail -n 10 /var/log/kibana/kibana.log\n<\/code><\/pre>\n<p>Comparer l'inode, la taille, l'espace disponible et la reprise des écritures ; vérifier également le service concerné. Aucun résultat réel après troncature de kibana.log n'est affirmé ici.<\/p>\n<h2>8. Cas WebLogic : fichier déjà supprimé<\/h2>\n<p>Lors de l'incident WebLogic, le fichier n'était plus accessible par son nom. La troncature a été réalisée via son descripteur ouvert, <code>&gt; /proc/204032/fd/1<\/code>, selon le compte rendu précédent. Le disque est passé de 100 % à 8 %. Ce PID historique ne doit jamais être réutilisé sans nouvelle investigation. Voir le <a href=\"#pratique-weblogic\">cas WebLogic détaillé<\/a>.<\/p>\n", "text": "## 1. Situation rencontrée\nLors du Health Check WSO2 / Grafana, un fichier `/var/log/kibana/kibana.log` de 11 Go a été identifié dans nos échanges. La sortie terminal originale et le résultat d'une éventuelle troncature de ce fichier ne sont pas disponibles ici. Les commandes et résultats ci-dessous constituent donc un exemple pédagogique, distinct de l'intervention WebLogic confirmée dans le chapitre précédent.\n\n## 2. Identifier le fichier et vérifier son état\nVérifier la taille, l'inode et les processus qui utilisent le fichier avant toute décision.\n\n```bash\nls -lh /var/log/kibana/kibana.log\nstat /var/log/kibana/kibana.log\nlsof /var/log/kibana/kibana.log\ndf -h /var/log/kibana\n```\n\n`ls -lh` affiche la taille lisible ; `stat` affiche notamment l'inode et les métadonnées ; `lsof` identifie les processus ayant ouvert le fichier ; `df` mesure le stockage du système de fichiers.\n\n**Exemple de résultat (fictif)**\n\n```text\nTaille : 11G\nInode : 123456\n```\n\n## 3. Pourquoi vider plutôt que supprimer ?\nUn processus peut continuer à écrire dans un fichier supprimé tant que son descripteur reste ouvert. La troncature conserve le nom et l'inode du fichier existant, mais ramène sa taille à zéro. Elle détruit son contenu ; elle ne ferme pas les descripteurs ni ne réinitialise nécessairement leur position d'écriture.\n\n## 4. Tester la méthode sur un fichier de laboratoire\n```bash\nlab=$(mktemp -d)\nprintf 'INFO : exemple de journal\\n' > \"$lab/demo.log\"\nls -li \"$lab/demo.log\"\ntruncate -s 0 \"$lab/demo.log\"\nls -li \"$lab/demo.log\"\n```\n\n**Exemple de résultat (fictif, simplifié)**\n\n```text\nAvant : inode 123456, taille 26 octets\nAprès : inode 123456, taille 0 octet\n```\n\nLe fichier existe toujours et son inode reste identique. `-s 0` signifie fixer la taille à zéro octet.\n\n## 5. Trois méthodes équivalentes sur un fichier existant\nChoisir une seule méthode. Les exemples utilisent le fichier de laboratoire créé précédemment.\n\n```bash\ntruncate -s 0 \"$lab/demo.log\"\n```\n\n`truncate` fixe explicitement la taille du fichier.\n\n```bash\n> \"$lab/demo.log\"\n```\n\n`>` est une redirection du shell : il ouvre le fichier en écriture et le tronque, même sans commande produisant du texte.\n\n```bash\ncat /dev/null > \"$lab/demo.log\"\n```\n\n`/dev/null` ne fournit aucune donnée à la lecture ; la redirection vide le fichier. C'est la redirection, et non `cat`, qui provoque la troncature.\n\n## 6. Intervention en production : précautions\nNe pas tronquer directement un fichier actif sans autorisation du responsable, vérification de la rétention, conservation des preuves nécessaires et confirmation du chemin et de l'inode. Préférer la rotation native du service lorsqu'elle est disponible. Ne jamais utiliser ces méthodes sur des fichiers de données de bases de données. Un processus qui écrit sans mode append peut reprendre à son ancien offset et créer un fichier creux ; surveiller la reprise des écritures. Ces commandes peuvent créer un fichier absent : confirmer son existence avant intervention.\n\n## 7. Vérifier après intervention\n```bash\nls -li /var/log/kibana/kibana.log\nstat /var/log/kibana/kibana.log\ndf -h /var/log/kibana\nlsof /var/log/kibana/kibana.log\ntail -n 10 /var/log/kibana/kibana.log\n```\nComparer l'inode, la taille, l'espace disponible et la reprise des écritures ; vérifier également le service concerné. Aucun résultat réel après troncature de kibana.log n'est affirmé ici.\n\n## 8. Cas WebLogic : fichier déjà supprimé\nLors de l'incident WebLogic, le fichier n'était plus accessible par son nom. La troncature a été réalisée via son descripteur ouvert, `> /proc/204032/fd/1`, selon le compte rendu précédent. Le disque est passé de 100 % à 8 %. Ce PID historique ne doit jamais être réutilisé sans nouvelle investigation. Voir le [cas WebLogic détaillé](#pratique-weblogic).\n", "practice": true, "example": null}, {"title": "Sécurité et permissions", "body": "<pre><code class=\"language-bash\">who\nw\nlast -a | head -n 20\nlastb | head -n 20\njournalctl -u sshd --since today | grep -Ei 'failed|invalid user'\ngrep -i 'failed password' /var/log/secure\nls -ld /opt/application\nstat /opt/application/config.properties\nnamei -l /opt/application/config.properties\ngetfacl /opt/application/config.properties\ngetenforce\nsestatus\nausearch -m AVC,USER_AVC -ts today\ndnf updateinfo list --security\ndnf check-update\n<\/code><\/pre>\n<p>SELinux enforcing applique les règles, permissive journalise, disabled désactive. Ne pas désactiver SELinux ni utiliser chmod 777 comme solution. Le code retour 100 de dnf check-update signifie mises à jour disponibles. Installation soumise à la gestion des changements.<\/p>\n", "text": "```bash\nwho\nw\nlast -a | head -n 20\nlastb | head -n 20\njournalctl -u sshd --since today | grep -Ei 'failed|invalid user'\ngrep -i 'failed password' /var/log/secure\nls -ld /opt/application\nstat /opt/application/config.properties\nnamei -l /opt/application/config.properties\ngetfacl /opt/application/config.properties\ngetenforce\nsestatus\nausearch -m AVC,USER_AVC -ts today\ndnf updateinfo list --security\ndnf check-update\n```\nSELinux enforcing applique les règles, permissive journalise, disabled désactive. Ne pas désactiver SELinux ni utiliser chmod 777 comme solution. Le code retour 100 de dnf check-update signifie mises à jour disponibles. Installation soumise à la gestion des changements.\n", "id": "chapitre-18", "lead": "Contrôler les connexions, les permissions et les règles de sécurité sans désactiver les protections.", "example": null}, {"title": "Certificats TLS", "body": "<pre><code class=\"language-bash\">openssl x509 -in certificat.crt -noout -subject -issuer -dates\nopenssl s_client -connect serveur.example.com:443 -servername serveur.example.com &lt;/dev/null 2&gt;/dev/null | openssl x509 -noout -subject -issuer -dates\nopenssl x509 -in certificat.crt -noout -checkend 2592000\nopenssl s_client -connect serveur.example.com:443 -servername serveur.example.com -verify_hostname serveur.example.com -verify_return_error &lt;/dev/null\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n  <th>Durée restante<\/th>\n  <th>Statut<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>&gt;60 jours<\/td>\n  <td>Normal<\/td>\n<\/tr>\n<tr>\n  <td>30–60 jours<\/td>\n  <td>Surveillance<\/td>\n<\/tr>\n<tr>\n  <td>7–29 jours<\/td>\n  <td>Renouvellement prioritaire<\/td>\n<\/tr>\n<tr>\n  <td>&lt;7 jours<\/td>\n  <td>Critique<\/td>\n<\/tr>\n<tr>\n  <td>Expiré<\/td>\n  <td>Incident potentiel<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Contrôler le certificat effectivement présenté, le nom et la chaîne intermédiaire. checkend retourne un statut non nul si expiration dans la période.<\/p>\n", "text": "```bash\nopenssl x509 -in certificat.crt -noout -subject -issuer -dates\nopenssl s_client -connect serveur.example.com:443 -servername serveur.example.com <\/dev/null 2>/dev/null | openssl x509 -noout -subject -issuer -dates\nopenssl x509 -in certificat.crt -noout -checkend 2592000\nopenssl s_client -connect serveur.example.com:443 -servername serveur.example.com -verify_hostname serveur.example.com -verify_return_error <\/dev/null\n```\n| Durée restante | Statut |\n|---|---|\n| >60 jours | Normal |\n| 30–60 jours | Surveillance |\n| 7–29 jours | Renouvellement prioritaire |\n| <7 jours | Critique |\n| Expiré | Incident potentiel |\nContrôler le certificat effectivement présenté, le nom et la chaîne intermédiaire. checkend retourne un statut non nul si expiration dans la période.\n", "id": "chapitre-19", "lead": "Contrôler l’expiration, le nom et la chaîne de confiance du certificat présenté par le service.", "example": ["openssl x509 -in certificat.crt -noout -subject -issuer -dates", "notAfter=Feb  1 23:59:59 2027 GMT", "Comparer la date d’expiration à la date actuelle et vérifier le certificat réellement servi."]}, {"title": "Horloge et NTP", "body": "<pre><code class=\"language-bash\">timedatectl status\nsystemctl status chronyd\nchronyc tracking\nchronyc sources -v\n<\/code><\/pre>\n<p>Contrôler sources NTP, décalage et synchronisation entre serveurs.<\/p>\n", "text": "```bash\ntimedatectl status\nsystemctl status chronyd\nchronyc tracking\nchronyc sources -v\n```\nContrôler sources NTP, décalage et synchronisation entre serveurs.\n", "id": "chapitre-20", "lead": "Une horloge synchronisée est essentielle pour les certificats, les transactions et les journaux.", "example": ["chronyc tracking", "Leap status     : Normal", "Vérifier également le décalage et les sources ; Normal seul ne suffit pas à établir la conformité."]}, {"title": "Tâches planifiées", "body": "<pre><code class=\"language-bash\">systemctl status crond\ncrontab -l\ncrontab -u utilisateur -l\ncat /etc/crontab\nls -l /etc/cron.d/\njournalctl -u crond --since '24 hours ago'\nsystemctl list-timers --all\n<\/code><\/pre>\n<p>Vérifier exécution et résultats des backups, purges, rotations, rapports et synchronisations. Accès aux crontabs d’autres utilisateurs uniquement avec autorisation.<\/p>\n", "text": "```bash\nsystemctl status crond\ncrontab -l\ncrontab -u utilisateur -l\ncat /etc/crontab\nls -l /etc/cron.d/\njournalctl -u crond --since '24 hours ago'\nsystemctl list-timers --all\n```\nVérifier exécution et résultats des backups, purges, rotations, rapports et synchronisations. Accès aux crontabs d’autres utilisateurs uniquement avec autorisation.\n", "id": "chapitre-21", "lead": "Vérifier que les tâches de maintenance et de sauvegarde sont planifiées et exécutées.", "example": null}, {"title": "Docker et Podman", "body": "<pre><code class=\"language-bash\">systemctl status docker\ndocker ps\ndocker ps -a\ndocker stats --no-stream\ndocker logs --tail 100 nom-conteneur\ndocker logs --since 1h nom-conteneur\ndocker inspect --format 'Status={{.State.Status}} OOM={{.State.OOMKilled}} Restarts={{.RestartCount}}' nom-conteneur\ndocker inspect --format '{{json .State.Health}}' nom-conteneur\ndocker system df\ndocker system df -v\ndocker volume ls\npodman ps -a\npodman stats --no-stream\npodman system df\npodman logs --tail 100 nom-conteneur\n<\/code><\/pre>\n<p>Podman rootless : visibilité selon utilisateur. Un état running ne garantit pas un healthcheck réussi. Ne jamais lancer docker system prune -a --volumes sans analyse et autorisation.<\/p>\n", "text": "```bash\nsystemctl status docker\ndocker ps\ndocker ps -a\ndocker stats --no-stream\ndocker logs --tail 100 nom-conteneur\ndocker logs --since 1h nom-conteneur\ndocker inspect --format 'Status={{.State.Status}} OOM={{.State.OOMKilled}} Restarts={{.RestartCount}}' nom-conteneur\ndocker inspect --format '{{json .State.Health}}' nom-conteneur\ndocker system df\ndocker system df -v\ndocker volume ls\npodman ps -a\npodman stats --no-stream\npodman system df\npodman logs --tail 100 nom-conteneur\n```\nPodman rootless : visibilité selon utilisateur. Un état running ne garantit pas un healthcheck réussi. Ne jamais lancer docker system prune -a --volumes sans analyse et autorisation.\n", "id": "chapitre-22", "lead": "Contrôler les conteneurs attendus, leur consommation, leurs redémarrages et leurs journaux.", "example": ["docker ps -a", "CONTAINER ID  IMAGE  STATUS\na1b2c3        nginx  Up 2 hours (healthy)", "Comparer aux conteneurs attendus ; un état healthy dépend du test configuré."]}, {"title": "Diagnostic Java / JVM", "body": "<pre><code class=\"language-bash\">pgrep -af java\njps -l\nps -p 2456 -o pid,user,%cpu,%mem,rss,etime,cmd\njcmd 2456 VM.flags\njcmd 2456 GC.heap_info\njstat -gcutil 2456 1000 5\ntop -H -p 2456\n# Après validation si nécessaire :\njcmd 2456 Thread.print\n<\/code><\/pre>\n<p>Heap saturée : OOM ; Full GC fréquent : lenteurs ; nombreux threads : mémoire ; deadlock : blocage ; descripteurs épuisés : connexions en échec. Outils JDK et même utilisateur souvent nécessaires. Les diagnostics peuvent avoir un impact.<\/p>\n", "text": "```bash\npgrep -af java\njps -l\nps -p 2456 -o pid,user,%cpu,%mem,rss,etime,cmd\njcmd 2456 VM.flags\njcmd 2456 GC.heap_info\njstat -gcutil 2456 1000 5\ntop -H -p 2456\n# Après validation si nécessaire :\njcmd 2456 Thread.print\n```\nHeap saturée : OOM ; Full GC fréquent : lenteurs ; nombreux threads : mémoire ; deadlock : blocage ; descripteurs épuisés : connexions en échec. Outils JDK et même utilisateur souvent nécessaires. Les diagnostics peuvent avoir un impact.\n", "id": "chapitre-23", "lead": "Identifier la JVM concernée puis examiner sa mémoire, ses threads et son activité GC.", "example": null}, {"title": "Contrôles avancés", "body": "<pre><code class=\"language-bash\">cat /proc/pressure/cpu\ncat /proc/pressure/memory\ncat /proc/pressure/io\nulimit -a\nsysctl kernel.threads-max\nsystemctl show nginx -p LimitNOFILE -p TasksCurrent -p TasksMax\ncoredumpctl list\ncoredumpctl info\nfindmnt -t nfs,nfs4\nnfsstat -m\njournalctl -k --since '24 hours ago' | grep -Ei 'hardware error|machine check|mce|edac'\nipcs -a\n<\/code><\/pre>\n<p>PSI mesure les retards liés à la contention. ulimit concerne la session actuelle. NFS bloqué peut entraîner des tâches D. Sur matéri
